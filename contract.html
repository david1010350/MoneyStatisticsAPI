<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Money Statistics - 合約</title>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>
    <script src="session.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #f5f5f7;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang TC",
                "Microsoft JhengHei",
                sans-serif;

            color: #1d1d1f;

        }


        .container {

            max-width: 720px;

            margin: 0 auto;

            padding: 60px 20px;

        }


        .card {

            background: white;

            border-radius: 24px;

            padding: 40px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.06);

        }


        h1 {

            margin-top: 0;

            font-size: 30px;

        }


        .description {

            color: #6e6e73;

            line-height: 1.7;

        }


        .email {

            margin-top: 20px;

            padding: 15px;

            background: #f5f5f7;

            border-radius: 14px;

        }


        button {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 14px;

            background: #0071e3;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            background: #0077ed;

        }


        .loading {

            text-align: center;

            color: #6e6e73;

        }


        .success {

            text-align: center;

        }


        .error {

            color: #c62828;

            background: #fff1f0;

            padding: 15px;

            border-radius: 12px;

            margin-top: 20px;

        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">

        <div id="content">

            <div class="loading">

                正在驗證登入狀態……

            </div>

        </div>

    </div>

</div>


<script>


    // =========================================================
    // Edge Function
    // =========================================================

    const CONTRACT_AUTH_FUNCTION =

        "https://hztxqrfuqgdktxaushfo.supabase.co/functions/v1/request-contract-access";


    // =========================================================
    // Windows Custom URI
    // =========================================================

    const WINDOWS_CALLBACK =

        "moneystatistics://contract/callback";


    // =========================================================
    // 初始化
    // =========================================================

    async function initialize() {

        try {

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (error) {

                throw error;

            }


            const session =
                data.session;


            // =================================================
            // 尚未登入
            // =================================================

            if (!session) {

                showLogin();

                return;

            }


            // =================================================
            // 已登入
            // =================================================

            showUser(
                session.user.email
            );


        }
        catch (error) {

            console.error(
                error
            );


            showError(
                "無法取得登入狀態。"
            );

        }

    }


    // =========================================================
    // 顯示登入
    // =========================================================

    function showLogin() {

        document.getElementById(
            "content"
        ).innerHTML = `

            <h1>
                Money Statistics
            </h1>

            <p class="description">

                請先登入您的 Money Statistics 帳號。

                <br>

                登入完成後，
                系統會自動返回 Windows 應用程式。

            </p>


            <button
                onclick="goLogin()"
            >
                前往登入
            </button>

        `;

    }


    // =========================================================
    // 前往登入
    // =========================================================

    function goLogin() {

        window.location.href =
            "login.html";

    }


    // =========================================================
    // 顯示使用者
    // =========================================================

    function showUser(
        email
    ) {

        document.getElementById(
            "content"
        ).innerHTML = `

            <h1>
                合約
            </h1>


            <p class="description">

                已確認您的登入狀態。

                <br>

                請點擊下方按鈕，
                將合約資訊傳回 Money Statistics Windows 應用程式。

            </p>


            <div class="email">

                <strong>
                    登入帳號
                </strong>

                <br><br>

                ${escapeHtml(email)}

            </div>


            <button
                onclick="requestContractAccess()"
            >
                返回 Money Statistics
            </button>

        `;

    }


    // =========================================================
    // 取得一次性授權碼
    // =========================================================

    async function requestContractAccess() {

    try {

        const {
            data: sessionData,
            error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError) {
            console.error("Session error:", sessionError);
            alert("無法取得登入狀態");
            return;
        }

        const session = sessionData.session;

        if (!session) {
            alert("請先登入");
            return;
        }


        const response = await fetch(
            "https://hztxqrfuqgdktxaushfo.supabase.co/functions/v1/request-contract-access",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",

                    "Authorization":
                        "Bearer " + session.access_token,

                    "apikey":
                        SUPABASE_ANON_KEY
                },

                body: JSON.stringify({})
            }
        );


        const responseText =
            await response.text();

        console.log(
            "request-contract-access response:",
            response.status,
            responseText
        );


        if (!response.ok) {

            console.error(
                "Edge Function error:",
                responseText
            );

            alert(
                "伺服器錯誤：" +
                response.status +
                "\n\n" +
                responseText
            );

            return;
        }


        let result;

        try {

            result =
                JSON.parse(responseText);

        } catch (error) {

            console.error(
                "JSON parse error:",
                error
            );

            alert(
                "伺服器回傳的資料不是有效 JSON。\n\n" +
                responseText
            );

            return;
        }


        console.log(
            "Parsed result:",
            result
        );


        if (
            !result ||
            !result.success
        ) {

            alert(
                "伺服器未成功建立授權碼。\n\n" +
                (result?.message || "未知錯誤")
            );

            return;
        }


        if (
            !result.callback_url
        ) {

            console.error(
                "Missing callback_url:",
                result
            );

            alert(
                "伺服器未回傳授權碼。"
            );

            return;
        }


        console.log(
            "Callback URL:",
            result.callback_url
        );


        // ======================================================
        // 開啟 Windows Money Statistics
        // ======================================================

        window.location.href =
            result.callback_url;

    } catch (error) {

        console.error(
            "Request contract access error:",
            error
        );

        alert(
            "無法連線至伺服器。\n\n" +
            error.message
        );

    }

}


    // =========================================================
    // HTML Escape
    // =========================================================

    function escapeHtml(
        value
    ) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    // =========================================================
    // Start
    // =========================================================

    initialize();

</script>


</body>

</html>
