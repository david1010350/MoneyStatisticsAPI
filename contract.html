<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Money Statistics - 合約</title>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #f5f5f7;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang TC",
                "Microsoft JhengHei",
                sans-serif;

            color: #1d1d1f;

        }


        .container {

            max-width: 720px;

            margin: 0 auto;

            padding: 60px 20px;

        }


        .card {

            background: white;

            border-radius: 24px;

            padding: 40px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.06);

        }


        h1 {

            margin-top: 0;

            font-size: 30px;

        }


        .description {

            color: #6e6e73;

            line-height: 1.7;

        }


        .email {

            margin-top: 20px;

            padding: 15px;

            background: #f5f5f7;

            border-radius: 14px;

        }


        button {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 14px;

            background: #0071e3;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            background: #0077ed;

        }


        .loading {

            text-align: center;

            color: #6e6e73;

        }


        .success {

            text-align: center;

        }


        .error {

            color: #c62828;

            background: #fff1f0;

            padding: 15px;

            border-radius: 12px;

            margin-top: 20px;

        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">

        <div id="content">

            <div class="loading">

                正在驗證登入狀態……

            </div>

        </div>

    </div>

</div>


<script>


    // =========================================================
    // Edge Function
    // =========================================================

    const CONTRACT_AUTH_FUNCTION =

        "https://hztxqrfuqgdktxaushfo.supabase.co/functions/v1/request-contract-access";


    // =========================================================
    // Windows Custom URI
    // =========================================================

    const WINDOWS_CALLBACK =

        "moneystatistics://contract/callback";


    // =========================================================
    // 初始化
    // =========================================================

    async function initialize() {

        try {

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (error) {

                throw error;

            }


            const session =
                data.session;


            // =================================================
            // 尚未登入
            // =================================================

            if (!session) {

                showLogin();

                return;

            }


            // =================================================
            // 已登入
            // =================================================

            showUser(
                session.user.email
            );


        }
        catch (error) {

            console.error(
                error
            );


            showError(
                "無法取得登入狀態。"
            );

        }

    }


    // =========================================================
    // 顯示登入
    // =========================================================

    function showLogin() {

        document.getElementById(
            "content"
        ).innerHTML = `

            <h1>
                Money Statistics
            </h1>

            <p class="description">

                請先登入您的 Money Statistics 帳號。

                <br>

                登入完成後，
                系統會自動返回 Windows 應用程式。

            </p>


            <button
                onclick="goLogin()"
            >
                前往登入
            </button>

        `;

    }


    // =========================================================
    // 前往登入
    // =========================================================

    function goLogin() {

        window.location.href =
            "login.html";

    }


    // =========================================================
    // 顯示使用者
    // =========================================================

    function showUser(
        email
    ) {

        document.getElementById(
            "content"
        ).innerHTML = `

            <h1>
                合約
            </h1>


            <p class="description">

                已確認您的登入狀態。

                <br>

                請點擊下方按鈕，
                將合約資訊傳回 Money Statistics Windows 應用程式。

            </p>


            <div class="email">

                <strong>
                    登入帳號
                </strong>

                <br><br>

                ${escapeHtml(email)}

            </div>


            <button
                onclick="requestContractAccess()"
            >
                返回 Money Statistics
            </button>

        `;

    }


    // =========================================================
    // 取得一次性授權碼
    // =========================================================

    async function requestContractAccess() {

        try {

            document.getElementById(
                "content"
            ).innerHTML = `

                <div class="success">

                    <h1>
                        正在驗證
                    </h1>

                    <p class="description">

                        正在建立安全連線，
                        請稍候……

                    </p>

                </div>

            `;


            const {
                data: {
                    session
                }
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (!session) {

                showLogin();

                return;

            }


            // =================================================
            // 呼叫 Edge Function
            // =================================================

            const response =
                await fetch(
                    CONTRACT_AUTH_FUNCTION,
                    {
                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " +
                                session.access_token

                        },

                        body: JSON.stringify({})

                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.message ||
                    "無法建立授權。"
                );

            }


            if (!result.success) {

                throw new Error(
                    result.message ||
                    "無法建立授權。"
                );

            }


            // =================================================
            // 一次性 Code
            // =================================================

            const code =
                result.code;


            if (!code) {

                throw new Error(
                    "伺服器未回傳授權碼。"
                );

            }


            // =================================================
            // 返回 Windows Form
            // =================================================

            window.location.href =
                WINDOWS_CALLBACK +
                "?code=" +
                encodeURIComponent(code);


        }
        catch (error) {

            console.error(
                error
            );


            showError(
                error.message ||
                "發生未知錯誤。"
            );

        }

    }


    // =========================================================
    // 顯示錯誤
    // =========================================================

    function showError(
        message
    ) {

        document.getElementById(
            "content"
        ).innerHTML = `

            <h1>
                發生錯誤
            </h1>

            <div class="error">

                ${escapeHtml(
                    message
                )}

            </div>

            <button
                onclick="initialize()"
            >
                重新嘗試
            </button>

        `;

    }


    // =========================================================
    // HTML Escape
    // =========================================================

    function escapeHtml(
        value
    ) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    // =========================================================
    // Start
    // =========================================================

    initialize();

</script>


</body>

</html>
