<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>重設密碼 - Money Statistics</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f5f5f7;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang TC",
                "Microsoft JhengHei",
                sans-serif;

            color: #1d1d1f;
        }


        .container {

            width: 100%;

            max-width: 420px;

            padding: 20px;
        }


        .card {

            background: white;

            border-radius: 24px;

            padding: 36px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.06);
        }


        h1 {

            margin: 0 0 10px;

            text-align: center;

            font-size: 28px;
        }


        .description {

            margin-bottom: 30px;

            text-align: center;

            color: #6e6e73;

            line-height: 1.6;

            font-size: 14px;
        }


        .input-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;
        }


        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d2d2d7;

            border-radius: 12px;

            font-size: 16px;

            outline: none;

            transition: border-color 0.2s;
        }


        input:focus {

            border-color: #0071e3;
        }


        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 12px;

            background: #0071e3;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;
        }


        button:hover {

            background: #0066cc;
        }


        button:disabled {

            opacity: 0.6;

            cursor: default;
        }


        #message {

            margin-top: 16px;

            text-align: center;

            font-size: 14px;

            line-height: 1.6;
        }


        .back-login {

            margin-top: 20px;

            text-align: center;
        }


        .back-login a {

            color: #0071e3;

            text-decoration: none;

            font-size: 14px;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">

        <h1>
            重設密碼
        </h1>


        <div class="description">

            請輸入新的帳號密碼。

        </div>


        <div class="input-group">

            <label for="password">
                新密碼
            </label>

            <input
                type="password"
                id="password"
                placeholder="請輸入新密碼"
            >

        </div>


        <div class="input-group">

            <label for="confirmPassword">
                確認新密碼
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="請再次輸入新密碼"
            >

        </div>


        <button
            id="updateButton"
            onclick="updatePassword()"
        >
            更新密碼
        </button>


        <div id="message"></div>


        <div class="back-login">

            <a href="login.html">
                返回登入
            </a>

        </div>

    </div>

</div>


<script>


    async function updatePassword() {

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("message");

        const button =
            document.getElementById("updateButton");


        if (!password) {

            message.textContent =
                "請輸入新密碼。";

            return;
        }


        if (password !== confirmPassword) {

            message.textContent =
                "兩次輸入的密碼不一致。";

            return;
        }


        if (password.length < 8) {

            message.textContent =
                "密碼至少需要 8 個字元。";

            return;
        }


        button.disabled = true;

        button.textContent =
            "更新中……";


        const { error } =
            await supabaseClient.auth.updateUser({

                password: password

            });


        if (error) {

            console.error(error);

            message.textContent =
                "密碼更新失敗：" + error.message;

            button.disabled = false;

            button.textContent =
                "更新密碼";

            return;
        }


        message.textContent =
            "密碼已成功更新，正在返回登入頁面……";


        setTimeout(() => {

            window.location.href =
                "login.html";

        }, 2000);

    }

</script>


</body>

</html>
