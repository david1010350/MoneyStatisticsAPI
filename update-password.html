<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>重設密碼 - Money Statistics</title>


    <!-- Supabase JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Supabase 設定 -->
    <script src="supabase.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            background: #f5f5f7;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang TC",
                "Microsoft JhengHei",
                sans-serif;

            color: #1d1d1f;
        }


        .container {

            width: 100%;

            max-width: 420px;

            padding: 20px;
        }


        .card {

            background: white;

            border-radius: 24px;

            padding: 36px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.06);
        }


        .logo {

            width: 72px;

            height: 72px;

            margin:
                0 auto
                24px;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .logo img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            display: block;
        }


        h1 {

            margin:
                0
                0
                12px;

            text-align: center;

            font-size: 28px;

            font-weight: 700;
        }


        .description {

            margin:
                0
                0
                30px;

            text-align: center;

            color: #6e6e73;

            font-size: 14px;

            line-height: 1.6;
        }


        .input-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;
        }


        input {

            width: 100%;

            padding:
                13px
                14px;

            border:
                1px solid
                #d2d2d7;

            border-radius: 12px;

            font-size: 16px;

            outline: none;

            transition:
                border-color
                0.2s;
        }


        input:focus {

            border-color:
                #0071e3;
        }


        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 12px;

            background:
                #0071e3;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background
                0.2s;
        }


        button:hover {

            background:
                #0066cc;
        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }


        #message {

            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 12px;

            text-align: center;

            font-size: 14px;

            line-height: 1.6;
        }


        .message-error {

            display: block !important;

            background:
                #fff1f0;

            color:
                #c62828;
        }


        .message-success {

            display: block !important;

            background:
                #eaf8ef;

            color:
                #1b7f3a;
        }


        .loading {

            text-align: center;

            color:
                #6e6e73;

            font-size: 14px;

            padding:
                20px
                0;
        }


        .form-content {

            display: none;
        }


        .footer {

            margin-top: 24px;

            text-align: center;

            color: #86868b;

            font-size: 12px;
        }


        @media (
            max-width: 480px
        ) {

            .container {

                padding: 16px;
            }


            .card {

                padding: 28px 22px;
            }


            h1 {

                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="card">


        <!-- Logo -->

        <div class="logo">

            <!--
                如果你有 Logo，
                請將 src 改成你的圖片網址
            -->

            <img
                src="https://www.dropbox.com/scl/fi/33fi9fbiq8j3wnwrytefl/newMS_White.png?rlkey=dhtxhyk47citb9dfuvjjsp6zx&st=g0yv4bqk&dl=1"
                alt="Money Statistics"
            >

        </div>


        <!-- Title -->

        <h1>
            重設密碼
        </h1>


        <!-- Description -->

        <p class="description">

            請輸入您的新密碼。

        </p>


        <!-- Loading -->

        <div
            id="loading"
            class="loading"
        >

            正在驗證密碼重設連結……

        </div>


        <!-- Form -->

        <div
            id="formContent"
            class="form-content"
        >


            <!-- New Password -->

            <div class="input-group">

                <label for="password">

                    新密碼

                </label>


                <input
                    type="password"
                    id="password"
                    placeholder="請輸入新密碼"
                    autocomplete="new-password"
                >

            </div>


            <!-- Confirm Password -->

            <div class="input-group">

                <label for="confirmPassword">

                    確認新密碼

                </label>


                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="請再次輸入新密碼"
                    autocomplete="new-password"
                >

            </div>


            <!-- Update Button -->

            <button
                id="updateButton"
                type="button"
                onclick="updatePassword()"
            >

                更新密碼

            </button>


        </div>


        <!-- Message -->

        <div id="message"></div>


    </div>


    <!-- Footer -->

    <div class="footer">

        Copyright ©
        <span id="copyrightYear"></span>
        David Kao.

    </div>


</div>


<script>


    /*
     * Recovery Session 是否有效
     */
    let recoverySessionValid = false;



    /*
     * 顯示訊息
     */
    function showMessage(
        text,
        type
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.textContent =
            text;


        message.className =
            "";


        if (
            type === "error"
        ) {

            message.classList.add(
                "message-error"
            );

        }


        if (
            type === "success"
        ) {

            message.classList.add(
                "message-success"
            );

        }

    }



    /*
     * 驗證 Recovery Link
     */
    async function checkRecoverySession() {

        const loading =
            document.getElementById(
                "loading"
            );


        const formContent =
            document.getElementById(
                "formContent"
            );


        try {


            /*
             * Supabase 會自動從網址 Hash
             * 取得 Recovery Token
             *
             * 例如：
             *
             * #access_token=...
             * &refresh_token=...
             * &type=recovery
             */


            const {
                data: {
                    session
                },
                error
            } =
            await supabaseClient
                .auth
                .getSession();


            /*
             * 發生錯誤
             */
            if (
                error
            ) {

                console.error(
                    "Recovery Session Error：",
                    error
                );


                loading.style.display =
                    "none";


                showMessage(
                    "無法驗證密碼重設連結，請聯絡 Money Statistics 管理員重新寄送密碼重設信。",
                    "error"
                );


                return;

            }


            /*
             * 沒有 Session
             */
            if (
                !session
            ) {

                loading.style.display =
                    "none";


                showMessage(
                    "此密碼重設連結已失效或不存在，請聯絡 Money Statistics 管理員重新寄送密碼重設信。",
                    "error"
                );


                return;

            }


            /*
             * 驗證成功
             */
            recoverySessionValid =
                true;


            loading.style.display =
                "none";


            formContent.style.display =
                "block";


        }
        catch (
            error
        ) {


            console.error(
                "Unexpected Error：",
                error
            );


            loading.style.display =
                "none";


            showMessage(
                "驗證密碼重設連結時發生錯誤。",
                "error"
            );

        }

    }



    /*
     * 更新密碼
     */
    async function updatePassword() {


        /*
         * 確認 Recovery Session
         */
        if (
            !recoverySessionValid
        ) {

            showMessage(
                "密碼重設連結尚未驗證成功。",
                "error"
            );


            return;

        }


        const password =
            document.getElementById(
                "password"
            ).value;


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        const button =
            document.getElementById(
                "updateButton"
            );


        /*
         * 檢查密碼
         */
        if (
            !password
        ) {

            showMessage(
                "請輸入新密碼。",
                "error"
            );


            return;

        }


        /*
         * 密碼長度
         */
        if (
            password.length < 8
        ) {

            showMessage(
                "密碼至少需要 8 個字元。",
                "error"
            );


            return;

        }


        /*
         * 確認密碼
         */
        if (
            password !==
            confirmPassword
        ) {

            showMessage(
                "兩次輸入的密碼不一致。",
                "error"
            );


            return;

        }


        /*
         * 更新中
         */
        button.disabled =
            true;


        button.textContent =
            "更新中……";


        /*
         * 更新 Supabase Password
         */
        const {
            error
        } =
        await supabaseClient
            .auth
            .updateUser({

                password:
                    password

            });


        /*
         * 發生錯誤
         */
        if (
            error
        ) {

            console.error(
                "Update Password Error：",
                error
            );


            showMessage(
                "密碼更新失敗：" +
                error.message,
                "error"
            );


            button.disabled =
                false;


            button.textContent =
                "更新密碼";


            return;

        }


        /*
         * 成功
         */
        showMessage(
            "密碼已成功更新，正在前往登入頁面……",
            "success"
        );


        button.textContent =
            "密碼更新成功";


        /*
         * 3 秒後回登入頁
         */
        setTimeout(
            function () {

                window.location.href =
                    "login.html";

            },
            3000
        );

    }



    /*
     * 自動設定年份
     */
    document.getElementById(
        "copyrightYear"
    ).textContent =
        new Date()
            .getFullYear();



    /*
     * 頁面載入後
     * 驗證 Recovery Link
     */
    document.addEventListener(
        "DOMContentLoaded",
        checkRecoverySession
    );


</script>


</body>

</html>
