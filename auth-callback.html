<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>驗證中 - Money Statistics</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f5f5f7;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang TC",
                "Microsoft JhengHei",
                sans-serif;

        }

        .card {

            width: 100%;

            max-width: 400px;

            margin: 20px;

            padding: 40px 30px;

            background: white;

            border-radius: 24px;

            text-align: center;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.06);

        }

        h1 {

            margin: 0 0 12px;

            font-size: 24px;

            color: #1d1d1f;

        }

        p {

            margin: 0;

            color: #6e6e73;

            line-height: 1.6;

        }

        .spinner {

            width: 32px;

            height: 32px;

            margin: 25px auto 0;

            border: 3px solid #e5e5e7;

            border-top-color: #0071e3;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

        }

        @keyframes spin {

            to {

                transform: rotate(360deg);

            }

        }

        .error {

            margin-top: 20px;

            color: #d93025;

        }

        .button {

            display: none;

            margin-top: 20px;

            padding: 12px 20px;

            border: none;

            border-radius: 10px;

            background: #0071e3;

            color: white;

            cursor: pointer;

        }

    </style>

</head>


<body>


<div class="card">

    <h1 id="title">
        正在驗證
    </h1>


    <p id="message">
        正在確認您的密碼重設連結……
    </p>


    <div
        id="spinner"
        class="spinner"
    ></div>


    <div
        id="error"
        class="error"
    ></div>


    <button
        id="loginButton"
        class="button"
        onclick="goLogin()"
    >
        返回登入
    </button>


</div>


<script>


    function goLogin() {

        window.location.href =
            "login.html";

    }


    function showError(message) {

        document
            .getElementById("spinner")
            .style.display = "none";


        document
            .getElementById("title")
            .textContent =
            "連結無效";


        document
            .getElementById("message")
            .textContent =
            "此密碼重設連結可能已失效。";


        document
            .getElementById("error")
            .textContent =
            message;


        document
            .getElementById("loginButton")
            .style.display =
            "inline-block";

    }


    async function initializeAuthCallback() {

        try {

            /*
             * Supabase 會自動從網址 Hash
             * 讀取 Recovery Token
             */

            const {

                data: {
                    session
                },

                error

            } =

            await supabaseClient
                .auth
                .getSession();


            if (error) {

                showError(
                    error.message
                );

                return;

            }


            /*
             * 成功取得 Recovery Session
             */

            if (session) {

                document
                    .getElementById("title")
                    .textContent =
                    "驗證成功";


                document
                    .getElementById("message")
                    .textContent =
                    "正在前往重設密碼頁面……";


                setTimeout(() => {

                    window.location.href =
                        "update-password.html";

                }, 800);


                return;

            }


            /*
             * 沒有 Session
             */

            showError(
                "無法取得密碼重設資訊。"
            );


        }

        catch (error) {

            console.error(error);

            showError(
                "系統發生錯誤。"
            );

        }

    }


    document.addEventListener(

        "DOMContentLoaded",

        initializeAuthCallback

    );


</script>


</body>

</html>
