<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        驗證中 - Money Statistics
    </title>


    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- Supabase 設定 -->
    <script src="supabase.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f5f5f7;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang TC",
                "Microsoft JhengHei",
                sans-serif;

            color: #1d1d1f;
        }


        .container {

            width: 100%;

            max-width: 420px;

            padding: 20px;
        }


        .card {

            background: white;

            border-radius: 24px;

            padding: 40px 30px;

            text-align: center;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.06);
        }


        .logo {

            width: 70px;

            height: 70px;

            margin:
                0 auto
                25px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .logo img {

            width: 100%;

            height: 100%;

            object-fit: contain;
        }


        h1 {

            margin:
                0
                0
                12px;

            font-size: 26px;

            font-weight: 700;
        }


        p {

            margin: 0;

            color: #6e6e73;

            font-size: 15px;

            line-height: 1.6;
        }


        .spinner {

            width: 32px;

            height: 32px;

            margin:
                25px auto
                0;

            border:
                3px solid
                #e5e5e7;

            border-top-color:
                #0071e3;

            border-radius: 50%;

            animation:
                spin
                0.8s
                linear
                infinite;
        }


        @keyframes spin {

            from {

                transform:
                    rotate(0deg);

            }

            to {

                transform:
                    rotate(360deg);

            }

        }


        .error {

            margin-top: 20px;

            padding: 15px;

            background: #fff1f0;

            color: #c62828;

            border-radius: 12px;

            font-size: 14px;

            line-height: 1.6;
        }


        .back-button {

            display: none;

            margin-top: 20px;

            padding: 12px 20px;

            border: none;

            border-radius: 12px;

            background: #0071e3;

            color: white;

            font-size: 14px;

            cursor: pointer;
        }


        .back-button:hover {

            background: #0066cc;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="card">


        <!-- Logo -->

        <div class="logo">

            <!--
            如果你有 Logo，
            可以把下面這行改成 img
            -->

            <span
                style="
                    font-size: 40px;
                    font-weight: 700;
                    color: #0071e3;
                "
            >
                M
            </span>

        </div>


        <h1
            id="title"
        >
            正在驗證
        </h1>


        <p
            id="description"
        >
            正在確認您的登入資訊，請稍候……
        </p>


        <div
            id="spinner"
            class="spinner"
        ></div>


        <div
            id="error"
        ></div>


        <button
            id="backButton"
            class="back-button"
            onclick="goLogin()"
        >
            返回登入
        </button>


    </div>


</div>


<script>


    /*
     * Money Statistics
     * Auth Callback
     */


    const title =
        document.getElementById("title");


    const description =
        document.getElementById("description");


    const spinner =
        document.getElementById("spinner");


    const errorBox =
        document.getElementById("error");


    const backButton =
        document.getElementById("backButton");



    /*
     * 顯示錯誤
     */
    function showError(message) {

        spinner.style.display =
            "none";


        title.textContent =
            "驗證失敗";


        description.textContent =
            "無法完成帳號驗證。";


        errorBox.innerHTML = `

            <div class="error">

                ${escapeHtml(message)}

            </div>

        `;


        backButton.style.display =
            "inline-block";

    }



    /*
     * HTML 安全處理
     */
    function escapeHtml(value) {

        if (
            value === null ||
            value === undefined
        ) {

            return "";

        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }



    /*
     * 返回登入
     */
    function goLogin() {

        window.location.href =
            "login.html";

    }



    /*
     * 跳轉至重設密碼
     */
    function goUpdatePassword() {

        title.textContent =
            "驗證成功";


        description.textContent =
            "正在前往重設密碼頁面……";


        setTimeout(() => {

            window.location.href =
                "update-password.html";

        }, 800);

    }



    /*
     * 初始化 Auth Callback
     */
    async function initializeAuthCallback() {

        try {


            /*
             * 先取得網址 Hash
             *
             * Supabase Recovery Link
             * 通常會包含：
             *
             * type=recovery
             */
            const hashParams =
                new URLSearchParams(

                    window.location.hash.substring(1)

                );


            /*
             * 取得網址 Query
             */
            const queryParams =
                new URLSearchParams(

                    window.location.search

                );


            /*
             * 判斷是否為 Recovery
             */
            const type =

                hashParams.get("type")

                ||

                queryParams.get("type");



            /*
             * 顯示 Recovery 狀態
             */
            if (
                type === "recovery"
            ) {

                title.textContent =
                    "正在驗證密碼重設";


                description.textContent =
                    "正在確認重設密碼連結……";

            }



            /*
             * 監聽 Supabase Auth
             */
            const {

                data: authListener

            } =

                supabaseClient.auth
                    .onAuthStateChange(

                        (
                            event,
                            session
                        ) => {


                            console.log(
                                "Auth Event：",
                                event
                            );


                            /*
                             * 密碼重設
                             */
                            if (
                                event ===
                                "PASSWORD_RECOVERY"
                            ) {

                                console.log(
                                    "Password Recovery 成功"
                                );


                                goUpdatePassword();

                            }


                        }

                    );



            /*
             * 等待 Supabase
             * 自動處理 URL Token
             */
            await new Promise(

                resolve =>

                    setTimeout(
                        resolve,
                        1000
                    )

            );



            /*
             * 再確認 Session
             */
            const {

                data: {

                    session

                },

                error

            } =

                await supabaseClient.auth
                    .getSession();



            /*
             * Session Error
             */
            if (
                error
            ) {

                console.error(
                    error
                );


                showError(
                    error.message
                );


                return;

            }



            /*
             * 已經有 Session
             */
            if (
                session
            ) {


                /*
                 * 如果網址是 Recovery
                 */
                if (
                    type === "recovery"
                ) {

                    goUpdatePassword();

                    return;

                }


                /*
                 * 其他登入成功
                 */
                title.textContent =
                    "登入成功";


                description.textContent =
                    "正在前往首頁……";


                setTimeout(() => {

                    window.location.href =
                        "index.html";

                }, 800);


                return;

            }



            /*
             * 沒有 Session
             */
            if (
                !session
            ) {

                /*
                 * 如果是 Recovery
                 * 但尚未取得 Session
                 *
                 * 再等待一次
                 */
                if (
                    type === "recovery"
                ) {


                    await new Promise(

                        resolve =>

                            setTimeout(
                                resolve,
                                1500
                            )

                    );


                    const {

                        data: {

                            session:
                            retrySession

                        }

                    }

                    =

                    await supabaseClient.auth
                        .getSession();



                    if (
                        retrySession
                    ) {

                        goUpdatePassword();

                        return;

                    }

                }


                /*
                 * 最後顯示錯誤
                 */
                showError(

                    "此驗證連結可能已失效，請重新申請驗證。"

                );

            }


        }

        catch (
            error
        ) {


            console.error(
                error
            );


            showError(

                error.message

                ||

                "系統發生錯誤。"

            );

        }

    }



    /*
     * 頁面載入
     */
    document.addEventListener(

        "DOMContentLoaded",

        initializeAuthCallback

    );


</script>


</body>

</html>
