    <script>


        // ==========================================================
        // Global Variables
        // ==========================================================


        let currentUser = null;

        let currentRoom = null;

        let supportConfig = {

            enabled: false,

            hours: 0,

            startTime: null,

            endTime: null,

            timezone: "Asia/Taipei"

        };


        let supportTimer = null;

        let realtimeChannel = null;

        let roomRealtimeChannel = null;

        let isSending = false;


        // ==========================================================
        // DOM
        // ==========================================================


        const userEmail =
            document.getElementById(
                "userEmail"
            );


        const logoutButton =
            document.getElementById(
                "logoutButton"
            );


        const supportStatus =
            document.getElementById(
                "supportStatus"
            );


        const supportStatusDot =
            document.getElementById(
                "supportStatusDot"
            );


        const supportPlan =
            document.getElementById(
                "supportPlan"
            );


        const chatHeaderStatus =
            document.getElementById(
                "chatHeaderStatus"
            );


        const messagesContainer =
            document.getElementById(
                "messages"
            );


        const emptyState =
            document.getElementById(
                "emptyState"
            );


        const closedBanner =
            document.getElementById(
                "closedBanner"
            );


        const messageInput =
            document.getElementById(
                "messageInput"
            );


        const sendButton =
            document.getElementById(
                "sendButton"
            );


        const currentYear =
            document.getElementById(
                "currentYear"
            );


        currentYear.textContent =
            new Date().getFullYear();


        // ==========================================================
        // Utility
        // ==========================================================


        function escapeHtml(
            value
        ) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                value ?? "";

            return div.innerHTML;

        }


        function formatTime(
            value
        ) {

            if (!value) {
                return "";
            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }


            return date.toLocaleTimeString(
                "zh-TW",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        function parseTimeToMinutes(
            value
        ) {

            if (!value) {
                return null;
            }


            const text =
                String(value)
                    .substring(0, 5);


            const parts =
                text.split(":");


            if (
                parts.length !== 2
            ) {

                return null;

            }


            const hour =
                Number(parts[0]);


            const minute =
                Number(parts[1]);


            if (
                !Number.isFinite(hour) ||
                !Number.isFinite(minute)
            ) {

                return null;

            }


            return (
                hour * 60 +
                minute
            );

        }


        function getCurrentTimeParts(
            timeZone
        ) {

            const formatter =
                new Intl.DateTimeFormat(
                    "en-US",
                    {
                        timeZone: timeZone,
                        hour12: false,
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );


            const parts =
                formatter.formatToParts(
                    new Date()
                );


            let hour = 0;

            let minute = 0;


            for (
                const part of parts
            ) {

                if (
                    part.type === "hour"
                ) {

                    hour =
                        Number(part.value);

                }


                if (
                    part.type === "minute"
                ) {

                    minute =
                        Number(part.value);

                }

            }


            /*
                Intl 有時會把午夜表示成 24。
                這裡統一轉成 0。
            */

            if (hour === 24) {
                hour = 0;
            }


            return {
                hour,
                minute
            };

        }


        // ==========================================================
        // Authentication
        // ==========================================================


        async function checkAuthentication() {

            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (error) {

                console.error(
                    "取得登入狀態失敗：",
                    error
                );

                window.location.href =
                    "login.html";

                return false;

            }


            if (
                !data ||
                !data.session ||
                !data.session.user
            ) {

                window.location.href =
                    "login.html";

                return false;

            }


            currentUser =
                data.session.user;


            userEmail.textContent =
                currentUser.email ||
                "";


            return true;

        }


        // ==========================================================
        // Logout
        // ==========================================================


        logoutButton.addEventListener(
            "click",
            async function () {

                logoutButton.disabled =
                    true;


                try {

                    await supabaseClient
                        .auth
                        .signOut();

                } catch (error) {

                    console.error(
                        "登出失敗：",
                        error
                    );

                }


                /*
                    本版本已經完全取消
                    30 分鐘固定 Session。

                    不再清除：
                    moneyStatisticsSessionExpire
                */

                window.location.href =

            }
        );


        // ==========================================================
        // Load Support Configuration
        // ==========================================================


        async function loadSupportConfig() {

            if (!currentUser) {
                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .schema("licenses")
                    .from("licenses_plan")
                    .select(
                        [
                            "id",
                            "plan_name",
                            "status",
                            "support_hours",
                            "support_start_time",
                            "support_end_time"
                        ].join(",")
                    )
                    .eq(
                        "owner_user",
                        currentUser.email
                    )
                    .in(
                        "status",
                        [
                            "active",
                            "pending"
                        ]
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    )
                    .limit(1);


            if (error) {

                console.error(
                    "讀取技術支援設定失敗：",
                    error
                );


                supportConfig = {

                    enabled: false,

                    hours: 0,

                    startTime: null,

                    endTime: null,

                    timezone:
                        "Asia/Taipei"

                };


                setSupportConfigError();

                return;

            }


            if (
                !data ||
                data.length === 0
            ) {

                supportConfig = {

                    enabled: false,

                    hours: 0,

                    startTime: null,

                    endTime: null,

                    timezone:
                        "Asia/Taipei"

                };


                supportPlan.textContent =
                    "目前沒有有效的技術支援方案";


                setSupportConfigError(
                    "目前沒有找到有效的方案資料。"
                );


                return;

            }


            const plan =
                data[0];


            const supportHours =
                Number(
                    plan.support_hours || 0
                );


            supportConfig = {

                enabled:
                    supportHours > 0,

                hours:
                    supportHours,

                startTime:
                    plan.support_start_time,

                endTime:
                    plan.support_end_time,

                timezone:
                    "Asia/Taipei"

            };


            supportPlan.textContent =
                `${plan.plan_name || "目前方案"} · ` +
                `方案狀態：${plan.status}`;


            console.log(
                "目前技術支援設定：",
                supportConfig
            );


            updateSupportState();


            if (supportTimer) {

                clearInterval(
                    supportTimer
                );

            }


            supportTimer =
                setInterval(
                    function () {

                        updateSupportState();

                    },
                    30000
                );

        }


        // ==========================================================
        // Support State
        // ==========================================================


        function getSupportState() {

            if (
                !supportConfig.enabled ||
                supportConfig.hours <= 0
            ) {

                return {

                    available: false,

                    reason: "disabled"

                };

            }


            /*
                只有 support_hours >= 24
                才視為 24 小時支援。

                因此：

                24 + 00:00–00:00
                = 24 小時

                12 + 00:00–00:00
                = 不會被誤判為 24 小時
            */

            if (
                supportConfig.hours >= 24
            ) {

                return {

                    available: true,

                    reason: "24h"

                };

            }


            if (
                !supportConfig.startTime ||
                !supportConfig.endTime
            ) {

                return {

                    available: false,

                    reason: "invalid"

                };

            }


            const now =
                getCurrentTimeParts(
                    "Asia/Taipei"
                );


            const nowMinutes =
                now.hour * 60 +
                now.minute;


            const start =
                parseTimeToMinutes(
                    supportConfig.startTime
                );


            const end =
                parseTimeToMinutes(
                    supportConfig.endTime
                );


            if (
                start === null ||
                end === null
            ) {

                return {

                    available: false,

                    reason: "invalid"

                };

            }


            /*
                一般時段：

                10:00 → 22:00
            */

            if (start < end) {

                return {

                    available:
                        nowMinutes >= start &&
                        nowMinutes < end,

                    reason: "normal",

                    start: start,

                    end: end

                };

            }


            /*
                跨日：

                22:00 → 06:00
            */

            return {

                available:
                    nowMinutes >= start ||
                    nowMinutes < end,

                reason: "overnight",

                start: start,

                end: end

            };

        }


        // ==========================================================
        // Update Support UI
        // ==========================================================


        function updateSupportState() {

            const state =
                getSupportState();


            if (
                state.available
            ) {

                setSupportAvailableState(
                    state
                );

            } else {

                setSupportUnavailableState(
                    state
                );

            }

        }


        function setSupportAvailableState(
            state
        ) {

            supportStatusDot.className =
                "status-dot";


            messageInput.disabled =
                false;


            sendButton.disabled =
                false;


            closedBanner.classList.remove(
                "show"
            );


            if (
                state.reason === "24h"
            ) {

                supportStatus.textContent =
                    "24 小時技術支援";


                chatHeaderStatus.textContent =
                    "技術支援服務中";

            } else {

                const start =
                    supportConfig.startTime
                        ? String(
                            supportConfig.startTime
                        ).substring(0, 5)
                        : "";


                const end =
                    supportConfig.endTime
                        ? String(
                            supportConfig.endTime
                        ).substring(0, 5)
                        : "";


                supportStatus.textContent =
                    `技術支援服務中 · ${start}–${end}`;


                chatHeaderStatus.textContent =
                    "技術支援服務中";

            }

        }


        function setSupportUnavailableState(
            state
        ) {

            supportStatusDot.className =
                "status-dot closed";


            messageInput.disabled =
                true;


            sendButton.disabled =
                true;


            if (
                state.reason === "invalid"
            ) {

                supportStatus.textContent =
                    "無法判斷技術支援時間";

                chatHeaderStatus.textContent =
                    "暫時無法使用";

                closedBanner.innerHTML =
                    "目前無法判斷技術支援時間。<br>" +
                    "請稍後重新整理頁面。";

            } else {

                supportStatus.textContent =
                    "目前非技術支援時間";

                chatHeaderStatus.textContent =
                    "目前暫停服務";

                closedBanner.innerHTML =
                    "目前不在技術支援服務時間內。<br>" +
                    "請於技術支援時間內重新聯絡我們。";

            }


            closedBanner.classList.add(
                "show"
            );

        }


        function setSupportConfigError(
            customMessage
        ) {

            supportStatusDot.className =
                "status-dot error";


            supportStatus.textContent =
                "無法取得技術支援設定";


            chatHeaderStatus.textContent =
                "暫時無法使用";


            messageInput.disabled =
                true;


            sendButton.disabled =
                true;


            closedBanner.innerHTML =
                escapeHtml(
                    customMessage ||
                    "目前無法取得您的技術支援設定。"
                ) +
                "<br>" +
                "請稍後重新整理頁面。";


            closedBanner.classList.add(
                "show"
            );

        }


        // ==========================================================
        // Find Open Room
        // ==========================================================


        async function loadCurrentRoom() {

            if (!currentUser) {
                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient
                .schema("public")
                    .from("chat_rooms")
                    .select("*")
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .eq(
                        "status",
                        "open"
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    )
                    .limit(1);


            if (error) {

                console.error(
                    "讀取聊天室失敗：",
                    error
                );

                return;

            }


            if (
                data &&
                data.length > 0
            ) {

                currentRoom =
                    data[0];


                await loadMessages();

                subscribeRealtime();

            } else {

                /*
                    沒有聊天室時，
                    不建立空聊天室。

                    等使用者第一次送出訊息
                    才建立聊天室。
                */

                currentRoom = null;

                showEmptyState();

            }

        }


        // ==========================================================
        // Create Room
        // ==========================================================


        async function createRoom() {

            if (!currentUser) {

                throw new Error(
                    "使用者尚未登入"
                );

            }


            const {
                data,
                error
            } =
                await supabaseClient
                .schema("public")
                    .from("chat_rooms")
                    .insert({

                        user_id:
                            currentUser.id,

                        user_email:
                            currentUser.email,

                        status:
                            "open",

                        unread_count:
                            0,

                        last_message:
                            null,

                        last_message_at:
                            null

                    })
                    .select()
                    .single();


            if (error) {

                console.error(
                    "建立聊天室失敗：",
                    error
                );

                throw error;

            }


            currentRoom =
                data;


            hideEmptyState();


            subscribeRealtime();


            return currentRoom;

        }


        // ==========================================================
        // Load Messages
        // ==========================================================


        async function loadMessages() {

            if (!currentRoom) {

                showEmptyState();

                return;

            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("chat_messages")
                    .select("*")
                    .eq(
                        "room_id",
                        currentRoom.id
                    )
                    .order(
                        "created_at",
                        {
                            ascending: true
                        }
                    );


            if (error) {

                console.error(
                    "讀取訊息失敗：",
                    error
                );

                return;

            }


            /*
                重新載入時清空畫面，
                再按照資料庫順序建立。
            */

            messagesContainer.innerHTML =
                "";


            if (
                !data ||
                data.length === 0
            ) {

                showEmptyState();

            } else {

                hideEmptyState();


                for (
                    const message of data
                ) {

                    appendMessage(
                        message
                    );

                }


                scrollMessagesToBottom();

            }


            /*
                使用者打開聊天室後，
                將客服訊息標記為已讀。
            */

            await markAdminMessagesRead();

        }


        // ==========================================================
        // Show / Hide Empty State
        // ==========================================================


        function showEmptyState() {

            messagesContainer.innerHTML =
                "";


            messagesContainer.appendChild(
                emptyState
            );


            emptyState.style.display =
                "flex";

        }


        function hideEmptyState() {

            if (
                emptyState &&
                emptyState.parentNode
            ) {

                emptyState.remove();

            }

        }


        // ==========================================================
        // Append Message
        // ==========================================================


        function appendMessage(
            message
        ) {

            if (!message) {
                return;
            }


            /*
                非常重要：

                檢查 message.id。

                因為自己的訊息會：

                ① INSERT 成功後立即顯示

                ② Realtime 又收到 INSERT

                如果沒有這個檢查，
                同一則訊息會出現兩次。
            */

            if (
                message.id !== undefined &&
                message.id !== null
            ) {

                const existing =
                    document.querySelector(
                        `[data-message-id="${message.id}"]`
                    );


                if (existing) {

                    return;

                }

            }


            hideEmptyState();


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                message.sender_type === "user"
                    ? "message-row user"
                    : "message-row admin";


            if (
                message.id !== undefined &&
                message.id !== null
            ) {

                row.dataset.messageId =
                    message.id;

            }


            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "message-wrapper";


            const sender =
                document.createElement(
                    "div"
                );


            sender.className =
                "message-sender";


            sender.textContent =
                message.sender_type === "user"
                    ? "您"
                    : "Money Statistics 技術支援";


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message-bubble";


            /*
                使用 textContent，
                不直接使用 innerHTML，
                避免使用者輸入 HTML / Script。
            */

            bubble.textContent =
                message.message || "";


            const time =
                document.createElement(
                    "div"
                );


            time.className =
                "message-time";


            time.textContent =
                formatTime(
                    message.created_at
                );


            wrapper.appendChild(
                sender
            );


            wrapper.appendChild(
                bubble
            );


            wrapper.appendChild(
                time
            );


            row.appendChild(
                wrapper
            );


            messagesContainer.appendChild(
                row
            );


            scrollMessagesToBottom();

        }


        // ==========================================================
        // Scroll
        // ==========================================================


        function scrollMessagesToBottom() {

            requestAnimationFrame(
                function () {

                    messagesContainer.scrollTop =
                        messagesContainer.scrollHeight;

                }
            );

        }


        // ==========================================================
        // Mark Admin Messages Read
        // ==========================================================


        async function markAdminMessagesRead() {

            if (!currentRoom) {
                return;
            }


            const {
                error: messageError
            } =
                await supabaseClient
                .schema("public")
                    .from("chat_messages")
                    .update({
                        is_read: true
                    })
                    .eq(
                        "room_id",
                        currentRoom.id
                    )
                    .eq(
                        "sender_type",
                        "admin"
                    )
                    .eq(
                        "is_read",
                        false
                    );


            if (messageError) {

                console.error(
                    "更新訊息已讀狀態失敗：",
                    messageError
                );

            }


            const {
                error: roomError
            } =
                await supabaseClient
                .schema("public")
                    .from("chat_rooms")
                    .update({

                        unread_count: 0

                    })
                    .eq(
                        "id",
                        currentRoom.id
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    );


            if (roomError) {

                console.error(
                    "更新聊天室未讀數失敗：",
                    roomError
                );

            }

        }


        // ==========================================================
        // Update Room Preview
        // ==========================================================


        async function updateRoomPreview(
            text
        ) {

            if (!currentRoom) {
                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient
                .schema("public")
                    .from("chat_rooms")
                    .update({

                        last_message:
                            text,

                        last_message_at:
                            new Date().toISOString(),

                        unread_count:
                            0

                    })
                    .eq(
                        "id",
                        currentRoom.id
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .select()
                    .single();


            if (error) {

                console.error(
                    "更新聊天室資訊失敗：",
                    error
                );

                return;

            }


            if (data) {

                currentRoom =
                    data;

            }

        }


        // ==========================================================
        // Send Message
        // ==========================================================


        async function sendMessage() {

            if (isSending) {
                return;
            }


            /*
                再確認一次支援時間。

                避免使用者在頁面開啟後，
                支援時間結束仍可以送出。
            */

            const supportState =
                getSupportState();


            if (
                !supportState.available
            ) {

                updateSupportState();

                return;

            }


            const text =
                messageInput.value.trim();


            if (!text) {
                return;
            }


            if (!currentUser) {
                return;
            }


            isSending = true;


            sendButton.disabled =
                true;


            messageInput.disabled =
                true;


            try {

                /*
                    如果沒有聊天室：

                    代表可能是：

                    ① 使用者第一次聯絡

                    ② 前一個聊天室已被客服關閉

                    此時建立新的 open room。
                */

                if (
                    !currentRoom ||
                    currentRoom.status !== "open"
                ) {

                    await createRoom();

                }


                /*
                    =================================================
                    真正的訊息 INSERT
                    =================================================
                */

                const {
                    data:
                        insertedMessage,
                    error
                } =
                    await supabaseClient
                    .schema("public")
                        .from("chat_messages")
                        .insert({

                            room_id:
                                currentRoom.id,

                            sender_id:
                                currentUser.id,

                            sender_email:
                                currentUser.email,

                            sender_type:
                                "user",

                            message:
                                text,

                            is_read:
                                false

                        })
                        .select()
                        .single();


                if (error) {

                    console.error(
                        "發送訊息失敗：",
                        error
                    );

                    alert(
                        "訊息發送失敗，請稍後再試。"
                    );

                    return;

                }


                /*
                    =================================================
                    ★ 關鍵修正
                    =================================================

                    INSERT 成功後，
                    不等待 Realtime。

                    直接把 Supabase 回傳的
                    insertedMessage 放到畫面。

                    所以現在使用者按送出後
                    會立即看到自己的訊息。
                */

                if (
                    insertedMessage
                ) {

                    appendMessage(
                        insertedMessage
                    );

                }


                /*
                    清空輸入框
                */

                messageInput.value =
                    "";


                autoResizeTextarea();


                /*
                    更新聊天室最後訊息
                */

                await updateRoomPreview(
                    text
                );


            } catch (error) {

                console.error(
                    "聊天室發送錯誤：",
                    error
                );


                alert(
                    "目前無法發送訊息，請稍後再試。"
                );

            } finally {

                isSending =
                    false;


                /*
                    發送完成後，
                    再依照目前支援時間
                    決定是否啟用輸入框。
                */

                const state =
                    getSupportState();


                if (
                    state.available
                ) {

                    messageInput.disabled =
                        false;

                    sendButton.disabled =
                        false;

                    messageInput.focus();

                } else {

                    updateSupportState();

                }

            }

        }


        // ==========================================================
        // Realtime
        // ==========================================================


        function subscribeRealtime() {

            if (!currentRoom) {
                return;
            }


            /*
                如果之前已經有訂閱，
                先解除。
            */

            if (
                realtimeChannel
            ) {

                supabaseClient
                    .removeChannel(
                        realtimeChannel
                    );

                realtimeChannel =
                    null;

            }


            if (
                roomRealtimeChannel
            ) {

                supabaseClient
                    .removeChannel(
                        roomRealtimeChannel
                    );

                roomRealtimeChannel =
                    null;

            }


            /*
                =====================================================
                Chat Messages Realtime
                =====================================================
            */

            realtimeChannel =
                supabaseClient
                    .channel(
                        "chat-messages-" +
                        currentRoom.id +
                        "-" +
                        Date.now()
                    )
                    .on(
                        "postgres_changes",
                        {

                            event:
                                "INSERT",

                            schema:
                                "public",

                            table:
                                "chat_messages",

                            filter:
                                "room_id=eq." +
                                currentRoom.id

                        },
                        function (
                            payload
                        ) {

                            console.log(
                                "收到聊天室新訊息：",
                                payload.new
                            );


                            /*
                                這裡不用判斷
                                sender_type。

                                使用 appendMessage()
                                裡面的 message.id
                                自動去重。

                                因此：

                                自己：
                                INSERT → 立即顯示
                                Realtime → 已存在 → 略過

                                客服：
                                Realtime → 顯示
                            */

                            appendMessage(
                                payload.new
                            );


                            /*
                                如果收到的是客服訊息，
                                自動標記已讀。
                            */

                            if (
                                payload.new
                                    .sender_type ===
                                "admin"
                            ) {

                                markAdminMessagesRead();

                            }

                        }
                    )
                    .subscribe(
                        function (
                            status
                        ) {

                            console.log(
                                "聊天室 Realtime 狀態：",
                                status
                            );

                        }
                    );


            /*
                =====================================================
                Chat Room Realtime
                =====================================================

                主要用來處理：

                客服關閉聊天室
                或聊天室狀態更新。
            */

            roomRealtimeChannel =
                supabaseClient
                    .channel(
                        "chat-room-" +
                        currentRoom.id +
                        "-" +
                        Date.now()
                    )
                    .on(
                        "postgres_changes",
                        {

                            event:
                                "UPDATE",

                            schema:
                                "public",

                            table:
                                "chat_rooms",

                            filter:
                                "id=eq." +
                                currentRoom.id

                        },
                        function (
                            payload
                        ) {

                            console.log(
                                "聊天室更新：",
                                payload.new
                            );


                            currentRoom =
                                payload.new;


                            if (
                                currentRoom.status ===
                                "closed"
                            ) {

                                handleRoomClosed();

                            }

                        }
                    )
                    .subscribe(
                        function (
                            status
                        ) {

                            console.log(
                                "聊天室狀態 Realtime：",
                                status
                            );

                        }
                    );

        }


        // ==========================================================
        // Handle Room Closed
        // ==========================================================


        function handleRoomClosed() {

            chatHeaderStatus.textContent =
                "聊天室已結束";


            closedBanner.innerHTML =
                "此聊天室已由技術支援人員結束。<br>" +
                "如果您還需要協助，請直接輸入新的訊息，系統會建立新的聊天室。";


            closedBanner.classList.add(
                "show"
            );


            /*
                即使聊天室已關閉，
                仍然讓使用者可以輸入。

                sendMessage() 發送時會發現
                currentRoom.status !== "open"

                然後建立新的聊天室。
            */

            const supportState =
                getSupportState();


            if (
                supportState.available
            ) {

                messageInput.disabled =
                    false;

                sendButton.disabled =
                    false;

            }

        }


        // ==========================================================
        // Textarea Auto Resize
        // ==========================================================


        function autoResizeTextarea() {

            messageInput.style.height =
                "auto";


            messageInput.style.height =
                Math.min(
                    messageInput.scrollHeight,
                    130
                ) + "px";

        }


        messageInput.addEventListener(
            "input",
            function () {

                autoResizeTextarea();

            }
        );


        // ==========================================================
        // Enter / Shift + Enter
        // ==========================================================


        messageInput.addEventListener(
            "keydown",
            function (event) {

                /*
                    Enter：
                    送出

                    Shift + Enter：
                    換行
                */

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        // ==========================================================
        // Send Button
        // ==========================================================


        sendButton.addEventListener(
            "click",
            function () {

                sendMessage();

            }
        );


        // ==========================================================
        // Cleanup Realtime
        // ==========================================================


        window.addEventListener(
            "beforeunload",
            function () {

                if (
                    realtimeChannel
                ) {

                    supabaseClient
                        .removeChannel(
                            realtimeChannel
                        );

                }


                if (
                    roomRealtimeChannel
                ) {

                    supabaseClient
                        .removeChannel(
                            roomRealtimeChannel
                        );

                }


                if (
                    supportTimer
                ) {

                    clearInterval(
                        supportTimer
                    );

                }

            }
        );


        // ==========================================================
        // Start
        // ==========================================================


        async function initialize() {

            console.log(
                "初始化 Money Statistics Live Chat..."
            );


            /*
                ★ 本版本不再有：

                moneyStatisticsSessionExpire
                SESSION_DURATION
                30 分鐘倒數
                sessionStorage Session Timer

                完全交給 Supabase Auth 管理登入狀態。
            */


            const authenticated =
                await checkAuthentication();


            if (!authenticated) {
                return;
            }


            await loadSupportConfig();


            /*
                只有有登入的使用者才讀取聊天室。
            */

            await loadCurrentRoom();


            console.log(
                "Live Chat 初始化完成。"
            );

        }


        initialize();

    </script>


</body>
