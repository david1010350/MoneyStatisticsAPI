<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Money Statistics - 客服</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f5f5f7;
            color: #1d1d1f;
        }

        /* =========================================================
           Header
        ========================================================= */

        .header {
            height: 64px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-bottom: 1px solid #e5e5e7;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .user-email {
            color: #6e6e73;
            font-size: 14px;
        }

        .logout-button {
            border: none;
            background: transparent;
            color: #0071e3;

            font-size: 14px;
            cursor: pointer;

            padding: 7px 10px;
            border-radius: 8px;
        }

        .logout-button:hover {
            background: #f0f0f2;
        }

        /* =========================================================
           Main
        ========================================================= */

        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px 50px;
        }

        .chat-card {
            height: calc(100vh - 150px);
            min-height: 520px;

            background: #ffffff;

            border: 1px solid #e5e5e7;
            border-radius: 18px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.05);

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* =========================================================
           Chat Header
        ========================================================= */

        .chat-header {
            min-height: 70px;

            display: flex;
            align-items: center;

            padding: 12px 22px;

            border-bottom: 1px solid #e5e5e7;

            flex-shrink: 0;
        }

        .support-icon {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            background: #0071e3;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;

            margin-right: 13px;

            flex-shrink: 0;
        }

        .support-title {
            font-size: 17px;
            font-weight: 600;
        }

        .support-status {
            margin-top: 3px;

            color: #86868b;

            font-size: 13px;
        }

        .status-dot {
            display: inline-block;

            width: 7px;
            height: 7px;

            background: #34c759;

            border-radius: 50%;

            margin-right: 5px;
        }

        .status-dot.closed {
            background: #8e8e93;
        }

        .status-dot.warning {
            background: #ff9500;
        }

        /* =========================================================
           Messages
        ========================================================= */

        .messages {
            flex: 1;

            overflow-y: auto;

            padding: 24px 22px;

            background: #fbfbfd;
        }

        .message-row {
            display: flex;

            margin-bottom: 14px;

            width: 100%;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.admin {
            justify-content: flex-start;
        }

        .message-content {
            max-width: min(72%, 620px);
        }

        .message-bubble {
            padding: 11px 15px;

            border-radius: 18px;

            font-size: 15px;
            line-height: 1.55;

            word-break: break-word;
            white-space: pre-wrap;
        }

        .message-row.user .message-bubble {
            background: #0071e3;
            color: white;

            border-bottom-right-radius: 5px;
        }

        .message-row.admin .message-bubble {
            background: #e9e9eb;
            color: #1d1d1f;

            border-bottom-left-radius: 5px;
        }

        .message-time {
            margin-top: 4px;

            font-size: 11px;

            color: #86868b;
        }

        .message-row.user .message-time {
            text-align: right;
        }

        .message-row.admin .message-time {
            text-align: left;
        }

        /* =========================================================
           Empty State
        ========================================================= */

        .empty-state {
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-direction: column;

            color: #86868b;

            text-align: center;

            padding: 30px;
        }

        .empty-icon {
            width: 58px;
            height: 58px;

            border-radius: 50%;

            background: #f0f0f2;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;

            margin-bottom: 14px;
        }

        .empty-title {
            color: #1d1d1f;

            font-size: 17px;
            font-weight: 600;

            margin-bottom: 6px;
        }

        .empty-description {
            font-size: 14px;
            line-height: 1.6;
            max-width: 430px;
        }

        /* =========================================================
           Input
        ========================================================= */

        .input-area {
            border-top: 1px solid #e5e5e7;

            padding: 14px 16px;

            background: #ffffff;

            display: flex;
            align-items: flex-end;

            gap: 10px;

            flex-shrink: 0;
        }

        .message-input {
            flex: 1;

            resize: none;

            min-height: 44px;
            max-height: 130px;

            border: 1px solid #d2d2d7;

            border-radius: 13px;

            padding: 11px 13px;

            font-family: inherit;
            font-size: 15px;

            outline: none;

            background: #ffffff;

            transition:
                border-color 0.15s,
                box-shadow 0.15s;
        }

        .message-input:focus {
            border-color: #0071e3;

            box-shadow:
                0 0 0 3px rgba(0, 113, 227, 0.12);
        }

        .message-input:disabled {
            background: #f5f5f7;
            color: #86868b;
            cursor: not-allowed;
        }

        .send-button {
            height: 44px;

            padding: 0 18px;

            border: none;

            border-radius: 12px;

            background: #0071e3;
            color: white;

            font-size: 15px;
            font-weight: 500;

            cursor: pointer;

            transition:
                background 0.15s,
                opacity 0.15s;
        }

        .send-button:hover {
            background: #0077ed;
        }

        .send-button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        /* =========================================================
           Closed / Support Time Banner
        ========================================================= */

        .closed-banner {
            display: none;

            padding: 13px 18px;

            background: #f5f5f7;

            border-top: 1px solid #e5e5e7;

            color: #6e6e73;

            text-align: center;

            font-size: 14px;

            line-height: 1.6;
        }

        .closed-banner.show {
            display: block;
        }

        .support-time {
            color: #1d1d1f;
            font-weight: 500;
        }

        /* =========================================================
           Modal
        ========================================================= */

        .modal-overlay {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            align-items: center;
            justify-content: center;

            z-index: 1000;

            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 390px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.18);

            padding: 28px 26px 22px;

            text-align: center;
        }

        .modal-icon {
            width: 52px;
            height: 52px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #f5f5f7;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 23px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;

            margin-bottom: 9px;
        }

        .modal-message {
            font-size: 14px;

            line-height: 1.6;

            color: #6e6e73;

            margin-bottom: 23px;
        }

        .modal-button {
            width: 100%;

            height: 44px;

            border: none;

            border-radius: 11px;

            background: #0071e3;
            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        /* =========================================================
           Loading
        ========================================================= */

        .loading {
            color: #86868b;

            font-size: 14px;

            text-align: center;

            padding: 30px;
        }

        /* =========================================================
           Mobile
        ========================================================= */

        @media (max-width: 700px) {

            .header {
                padding: 0 15px;
            }

            .header-title {
                font-size: 18px;
            }

            .user-email {
                display: none;
            }

            .page {
                padding: 0;
            }

            .chat-card {
                height: calc(100vh - 64px);

                min-height: 0;

                border-radius: 0;

                border-left: none;
                border-right: none;

                box-shadow: none;
            }

            .message-content {
                max-width: 82%;
            }

            .messages {
                padding: 20px 14px;
            }

            .input-area {
                padding: 10px;
            }

            .send-button {
                padding: 0 15px;
            }

        }

    </style>
</head>

<body>

    <!-- =========================================================
         Header
    ========================================================= -->

    <header class="header">

        <div class="header-title">
            Money Statistics
        </div>

        <div class="header-right">

            <span
                id="userEmail"
                class="user-email">
                載入中...
            </span>

            <button
                id="logoutButton"
                class="logout-button">
                登出
            </button>

        </div>

    </header>


    <!-- =========================================================
         Main
    ========================================================= -->

    <main class="page">

        <section class="chat-card">

            <!-- Chat Header -->

            <div class="chat-header">

                <div class="support-icon">
                    💬
                </div>

                <div>

                    <div class="support-title">
                        Money Statistics 客服
                    </div>

                    <div
                        id="supportStatus"
                        class="support-status">

                        <span class="status-dot"></span>
                        載入支援時間...

                    </div>

                </div>

            </div>


            <!-- Messages -->

            <div
                id="messages"
                class="messages">

                <div class="loading">
                    正在載入聊天室...
                </div>

            </div>


            <!-- Closed / Support Time Banner -->

            <div
                id="closedBanner"
                class="closed-banner">
            </div>


            <!-- Input -->

            <div class="input-area">

                <textarea
                    id="messageInput"
                    class="message-input"
                    placeholder="輸入訊息..."
                    rows="1"></textarea>

                <button
                    id="sendButton"
                    class="send-button">

                    傳送

                </button>

            </div>

        </section>

    </main>


    <!-- =========================================================
         Session Expired Modal
    ========================================================= -->

    <div
        id="sessionModal"
        class="modal-overlay">

        <div class="modal">

            <div class="modal-icon">
                🔒
            </div>

            <div class="modal-title">
                工作階段已結束
            </div>

            <div class="modal-message">

                為了保護您的帳號安全，
                此次工作階段已經結束。

                <br>

                請重新登入 Money Statistics。

            </div>

            <button
                id="sessionConfirmButton"
                class="modal-button">

                確定

            </button>

        </div>

    </div>


    <script>

        // =========================================================
        // Session
        // =========================================================

        const MONEY_STATISTICS_SESSION_KEY =
            "moneyStatisticsSessionExpire";

        const SESSION_DURATION =
            30 * 60 * 1000;


        // =========================================================
        // State
        // =========================================================

        let currentUser = null;

        let currentRoom = null;

        let realtimeChannel = null;

        let sessionTimer = null;

        let supportTimer = null;

        let loadingMessages = false;

        let supportConfig = {
            enabled: false,
            hours: 0,
            startTime: null,
            endTime: null,
            timezone: "Asia/Taipei"
        };


        // =========================================================
        // DOM
        // =========================================================

        const userEmail =
            document.getElementById("userEmail");

        const messages =
            document.getElementById("messages");

        const messageInput =
            document.getElementById("messageInput");

        const sendButton =
            document.getElementById("sendButton");

        const logoutButton =
            document.getElementById("logoutButton");

        const closedBanner =
            document.getElementById("closedBanner");

        const supportStatus =
            document.getElementById("supportStatus");

        const sessionModal =
            document.getElementById("sessionModal");

        const sessionConfirmButton =
            document.getElementById("sessionConfirmButton");


        // =========================================================
        // Start
        // =========================================================

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                try {

                    await checkSession();

                } catch (error) {

                    console.error(
                        "初始化失敗：",
                        error
                    );

                    redirectToLogin();

                }

            }
        );


        // =========================================================
        // Check Session
        // =========================================================

        async function checkSession() {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();

            if (
                error ||
                !data ||
                !data.session ||
                !data.session.user
            ) {

                redirectToLogin();

                return;

            }

            currentUser =
                data.session.user;

            userEmail.textContent =
                currentUser.email || "";


            // -----------------------------------------------------
            // 30 分鐘工作階段
            // -----------------------------------------------------

            let expireTime =
                sessionStorage.getItem(
                    MONEY_STATISTICS_SESSION_KEY
                );


            if (!expireTime) {

                expireTime =
                    Date.now() +
                    SESSION_DURATION;

                sessionStorage.setItem(
                    MONEY_STATISTICS_SESSION_KEY,
                    expireTime.toString()
                );

            }


            if (
                Date.now() >=
                Number(expireTime)
            ) {

                showSessionExpired();

                return;

            }


            startSessionTimer(
                Number(expireTime)
            );


            // -----------------------------------------------------
            // 讀取客服方案
            // -----------------------------------------------------

            await loadSupportConfig();


            // -----------------------------------------------------
            // 初始化聊天室
            // -----------------------------------------------------

            await initializeChat();

        }


        // =========================================================
        // Session Timer
        // =========================================================

        function startSessionTimer(
            expireTime
        ) {

            if (sessionTimer) {

                clearTimeout(
                    sessionTimer
                );

            }


            const remaining =
                expireTime -
                Date.now();


            if (remaining <= 0) {

                showSessionExpired();

                return;

            }


            sessionTimer =
                setTimeout(
                    function () {

                        showSessionExpired();

                    },
                    remaining
                );

        }


        // =========================================================
        // Session Expired
        // =========================================================

        function showSessionExpired() {

            if (sessionTimer) {

                clearTimeout(
                    sessionTimer
                );

                sessionTimer = null;

            }


            messageInput.disabled = true;

            sendButton.disabled = true;


            sessionModal.classList.add(
                "show"
            );

        }


        sessionConfirmButton.addEventListener(
            "click",
            async function () {

                sessionStorage.removeItem(
                    MONEY_STATISTICS_SESSION_KEY
                );


                await supabaseClient.auth.signOut();


                redirectToLogin();

            }
        );


        // =========================================================
        // Redirect Login
        // =========================================================

        function redirectToLogin() {

            window.location.href =
                "login.html";

        }


        // =========================================================
        // Load Support Configuration
        // =========================================================

        async function loadSupportConfig() {

            if (!currentUser) {

                return;

            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .schema("licenses")
                    .from("licenses_plan")
                    .select(
                        [
                            "id",
                            "plan_name",
                            "status",
                            "support_enabled",
                            "support_hours",
                            "support_start_time",
                            "support_end_time",
                            "support_timezone"
                        ].join(",")
                    )
                    .eq(
                        "owner_user",
                        currentUser.email
                    )
                    .eq(
                        "status",
                        "pending",
                        "active"
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    )
                    .limit(1);


            if (error) {

                console.error(
                    "讀取技術支援設定失敗：",
                    error
                );

                supportConfig = {
                    enabled: false,
                    hours: 0,
                    startTime: null,
                    endTime: null,
                    timezone: "Asia/Taipei"
                };

                setSupportUnavailableState(
                    "目前無法取得您的技術支援設定。"
                );

                return;

            }


            if (
                !data ||
                data.length === 0
            ) {

                supportConfig = {
                    enabled: false,
                    hours: 0,
                    startTime: null,
                    endTime: null,
                    timezone: "Asia/Taipei"
                };

                setSupportUnavailableState(
                    "目前沒有可用的技術支援方案。"
                );

                return;

            }


            const plan =
                data[0];


            supportConfig = {
                enabled:
                    plan.support_enabled === true,

                hours:
                    Number(
                        plan.support_hours || 0
                    ),

                startTime:
                    plan.support_start_time,

                endTime:
                    plan.support_end_time,

                timezone:
                    plan.support_timezone ||
                    "Asia/Taipei"
            };


            updateSupportState();


            // -----------------------------------------------------
            // 定期重新檢查支援時間
            // -----------------------------------------------------

            if (supportTimer) {

                clearInterval(
                    supportTimer
                );

            }


            supportTimer =
                setInterval(
                    function () {

                        updateSupportState();

                    },
                    30000
                );

        }


        // =========================================================
        // Support Time Calculation
        // =========================================================

        function getSupportState() {

            if (
                !supportConfig.enabled ||
                supportConfig.hours <= 0
            ) {

                return {
                    available: false,
                    reason: "disabled"
                };

            }


            // -----------------------------------------------------
            // 24 小時 = 全天
            // -----------------------------------------------------

            if (
                supportConfig.hours >= 24
            ) {

                return {
                    available: true,
                    reason: "24h"
                };

            }


            if (
                !supportConfig.startTime ||
                !supportConfig.endTime
            ) {

                return {
                    available: false,
                    reason: "invalid"
                };

            }


            const now =
                getCurrentTimeParts(
                    supportConfig.timezone
                );


            const nowMinutes =
                now.hour * 60 +
                now.minute;


            const start =
                parseTimeToMinutes(
                    supportConfig.startTime
                );


            const end =
                parseTimeToMinutes(
                    supportConfig.endTime
                );


            if (
                start === null ||
                end === null
            ) {

                return {
                    available: false,
                    reason: "invalid"
                };

            }


            // -----------------------------------------------------
            // 00:00 - 00:00
            // 若 hours 不是 24，仍視為全天
            // -----------------------------------------------------

            if (
                start === 0 &&
                end === 0
            ) {

                return {
                    available: true,
                    reason: "24h"
                };

            }


            // -----------------------------------------------------
            // 一般時間，例如 10:00 - 22:00
            // -----------------------------------------------------

            if (start < end) {

                return {
                    available:
                        nowMinutes >= start &&
                        nowMinutes < end,

                    reason: "normal",

                    start: start,
                    end: end
                };

            }


            // -----------------------------------------------------
            // 跨午夜，例如 22:00 - 06:00
            // -----------------------------------------------------

            return {
                available:
                    nowMinutes >= start ||
                    nowMinutes < end,

                reason: "overnight",

                start: start,
                end: end
            };

        }


        // =========================================================
        // Current Time
        // =========================================================

        function getCurrentTimeParts(
            timezone
        ) {

            const formatter =
                new Intl.DateTimeFormat(
                    "zh-TW",
                    {
                        timeZone:
                            timezone ||
                            "Asia/Taipei",

                        hour: "2-digit",
                        minute: "2-digit",
                        hour12: false
                    }
                );


            const parts =
                formatter.formatToParts(
                    new Date()
                );


            let hour = 0;
            let minute = 0;


            parts.forEach(
                function (part) {

                    if (
                        part.type === "hour"
                    ) {

                        hour =
                            Number(part.value);

                    }

                    if (
                        part.type === "minute"
                    ) {

                        minute =
                            Number(part.value);

                    }

                }
            );


            return {
                hour: hour,
                minute: minute
            };

        }


        // =========================================================
        // Parse Time
        // =========================================================

        function parseTimeToMinutes(
            value
        ) {

            if (!value) {

                return null;

            }


            const text =
                String(value)
                    .substring(0, 5);


            const parts =
                text.split(":");


            if (
                parts.length !== 2
            ) {

                return null;

            }


            const hour =
                Number(parts[0]);

            const minute =
                Number(parts[1]);


            if (
                Number.isNaN(hour) ||
                Number.isNaN(minute) ||
                hour < 0 ||
                hour > 23 ||
                minute < 0 ||
                minute > 59
            ) {

                return null;

            }


            return (
                hour * 60 +
                minute
            );

        }


        // =========================================================
        // Format Support Time
        // =========================================================

        function formatSupportTime() {

            if (
                supportConfig.hours >= 24 ||
                (
                    parseTimeToMinutes(
                        supportConfig.startTime
                    ) === 0 &&
                    parseTimeToMinutes(
                        supportConfig.endTime
                    ) === 0
                )
            ) {

                return "24 小時技術支援";

            }


            if (
                !supportConfig.startTime ||
                !supportConfig.endTime
            ) {

                return "技術支援時間未設定";

            }


            return (
                formatTimeValue(
                    supportConfig.startTime
                ) +
                "–" +
                formatTimeValue(
                    supportConfig.endTime
                )
            );

        }


        function formatTimeValue(
            value
        ) {

            if (!value) {

                return "";

            }


            return String(value)
                .substring(0, 5);

        }


        // =========================================================
        // Update Support State
        // =========================================================

        function updateSupportState() {

            const state =
                getSupportState();


            if (
                state.available
            ) {

                setSupportAvailableState();

            } else {

                setSupportUnavailableState();

            }

        }


        // =========================================================
        // Support Available
        // =========================================================

        function setSupportAvailableState() {

            supportStatus.innerHTML = `
                <span class="status-dot"></span>
                線上客服
            `;


            // 如果是「沒有聊天室」
            // 才允許輸入建立新聊天室

            if (!currentRoom) {

                messageInput.disabled =
                    false;

                sendButton.disabled =
                    false;

                messageInput.placeholder =
                    "輸入訊息...";

            }


            // 如果目前聊天室是開啟的
            if (
                currentRoom &&
                currentRoom.status === "open"
            ) {

                messageInput.disabled =
                    false;

                sendButton.disabled =
                    false;

                messageInput.placeholder =
                    "輸入訊息...";

            }


            // 如果聊天室已關閉
            if (
                currentRoom &&
                currentRoom.status === "closed"
            ) {

                messageInput.disabled =
                    false;

                sendButton.disabled =
                    false;

                messageInput.placeholder =
                    "輸入訊息以開始新的客服對話...";

            }


            closedBanner.classList.remove(
                "show"
            );

        }


        // =========================================================
        // Support Unavailable
        // =========================================================

        function setSupportUnavailableState(
            customMessage
        ) {

            supportStatus.innerHTML = `
                <span class="status-dot warning"></span>
                目前非技術支援時間
            `;


            messageInput.disabled =
                true;

            sendButton.disabled =
                true;


            const timeText =
                formatSupportTime();


            closedBanner.innerHTML = `
                ${customMessage
                    ? escapeHtml(customMessage)
                    : "目前非技術支援時間。"
                }

                <br>

                技術支援時間：
                <span class="support-time">
                    ${escapeHtml(timeText)}
                </span>
            `;


            closedBanner.classList.add(
                "show"
            );

        }


        // =========================================================
        // Initialize Chat
        // =========================================================

        async function initializeChat() {

            await loadOrCreateRoom();

            if (currentRoom) {

                await loadMessages();

                subscribeRealtime();

            }

        }


        // =========================================================
        // Load / Create Room
        // =========================================================

        async function loadOrCreateRoom() {

            if (!currentUser) {

                return;

            }


            // -----------------------------------------------------
            // 找目前使用者的開啟聊天室
            // -----------------------------------------------------

            const {
                data,
                error
            } =
                await supabaseClient
                    .schema("public")
                    .from("chat_rooms")
                    .select("*")
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .eq(
                        "status",
                        "open"
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    )
                    .limit(1);


            if (error) {

                console.error(
                    "讀取聊天室失敗：",
                    error
                );

                showError(
                    "無法載入客服聊天室。"
                );

                return;

            }


            if (
                data &&
                data.length > 0
            ) {

                currentRoom =
                    data[0];

                setChatOpenState();

                return;

            }


            // -----------------------------------------------------
            // 沒有聊天室
            // -----------------------------------------------------

            currentRoom = null;

            setChatWaitingState();

        }


        // =========================================================
        // Create Room
        // =========================================================

        async function createRoom() {

            if (!currentUser) {

                return null;

            }


            // -----------------------------------------------------
            // 建立聊天室前再次確認支援時間
            // -----------------------------------------------------

            const supportState =
                getSupportState();


            if (!supportState.available) {

                updateSupportState();

                return null;

            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .schema("public")
                    .from("chat_rooms")
                    .insert({

                        user_id:
                            currentUser.id,

                        user_email:
                            currentUser.email,

                        status:
                            "open",

                        unread_count:
                            0,

                        last_message:
                            null,

                        last_message_at:
                            null

                    })
                    .select()
                    .single();


            if (error) {

                console.error(
                    "建立聊天室失敗：",
                    error
                );

                return null;

            }


            currentRoom =
                data;


            setChatOpenState();

            subscribeRealtime();


            return currentRoom;

        }


        // =========================================================
        // Waiting State
        // =========================================================

        function setChatWaitingState() {

            const supportState =
                getSupportState();


            if (!supportState.available) {

                messages.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            🕐
                        </div>

                        <div class="empty-title">
                            目前非技術支援時間
                        </div>

                        <div class="empty-description">
                            ${escapeHtml(
                                getSupportUnavailableDescription()
                            )}
                        </div>

                    </div>

                `;

                updateSupportState();

                return;

            }


            closedBanner.classList.remove(
                "show"
            );


            messageInput.disabled =
                false;

            sendButton.disabled =
                false;


            messages.innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">
                        💬
                    </div>

                    <div class="empty-title">
                        需要協助嗎？
                    </div>

                    <div class="empty-description">
                        請輸入訊息，我們會為您建立客服聊天室。
                    </div>

                </div>

            `;


            supportStatus.innerHTML = `
                <span class="status-dot"></span>
                線上客服
            `;

        }


        // =========================================================
        // Support Unavailable Description
        // =========================================================

        function getSupportUnavailableDescription() {

            if (!supportConfig.enabled) {

                return "目前您的方案未提供技術支援服務。";

            }


            return (
                "目前非技術支援時間。技術支援時間為 " +
                formatSupportTime() +
                "。"
            );

        }


        // =========================================================
        // Open State
        // =========================================================

        function setChatOpenState() {

            closedBanner.classList.remove(
                "show"
            );


            const supportState =
                getSupportState();


            if (!supportState.available) {

                updateSupportState();

                return;

            }


            messageInput.disabled =
                false;

            sendButton.disabled =
                false;


            messageInput.placeholder =
                "輸入訊息...";


            supportStatus.innerHTML = `
                <span class="status-dot"></span>
                線上客服
            `;

        }


        // =========================================================
        // Closed State
        // =========================================================

        function setChatClosedState() {

            const supportState =
                getSupportState();


            if (!supportState.available) {

                messageInput.disabled =
                    true;

                sendButton.disabled =
                    true;

                supportStatus.innerHTML = `
                    <span class="status-dot warning"></span>
                    目前非技術支援時間
                `;

                closedBanner.innerHTML = `
                    此聊天室已結束。

                    <br>

                    目前非技術支援時間。
                    技術支援時間：
                    <span class="support-time">
                        ${escapeHtml(
                            formatSupportTime()
                        )}
                    </span>
                `;

                closedBanner.classList.add(
                    "show"
                );

                return;

            }


            messageInput.disabled =
                false;

            sendButton.disabled =
                false;

            messageInput.placeholder =
                "輸入訊息以開始新的客服對話...";


            closedBanner.innerHTML =
                "此聊天室已結束。若您需要協助，請輸入新的訊息建立客服聊天室。";


            closedBanner.classList.add(
                "show"
            );


            supportStatus.innerHTML = `
                <span class="status-dot"></span>
                線上客服
            `;


            messages.innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">
                        ✓
                    </div>

                    <div class="empty-title">
                        聊天室已結束
                    </div>

                    <div class="empty-description">
                        您可以輸入新的訊息開始新的客服對話。
                    </div>

                </div>

            `;

        }


        // =========================================================
        // Load Messages
        // =========================================================

        async function loadMessages() {

            if (
                !currentRoom ||
                loadingMessages
            ) {

                return;

            }


            loadingMessages = true;


            const {
                data,
                error
            } =
                await supabaseClient
                    .schema("public")
                    .from("chat_messages")
                    .select("*")
                    .eq(
                        "room_id",
                        currentRoom.id
                    )
                    .order(
                        "created_at",
                        {
                            ascending: true
                        }
                    );


            loadingMessages = false;


            if (error) {

                console.error(
                    "讀取訊息失敗：",
                    error
                );

                showError(
                    "無法載入聊天訊息。"
                );

                return;

            }


            renderMessages(
                data || []
            );


            await markMessagesAsRead();

        }


        // =========================================================
        // Render Messages
        // =========================================================

        function renderMessages(
            messageList
        ) {

            if (
                !messageList ||
                messageList.length === 0
            ) {

                messages.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            💬
                        </div>

                        <div class="empty-title">
                            開始與客服聊天
                        </div>

                        <div class="empty-description">
                            請輸入您的問題，我們會盡快回覆。
                        </div>

                    </div>

                `;

                return;

            }


            messages.innerHTML = "";


            messageList.forEach(
                function (message) {

                    appendMessage(
                        message,
                        false
                    );

                }
            );


            scrollMessagesToBottom();

        }


        // =========================================================
        // Append Message
        // =========================================================

        function appendMessage(
            message,
            scroll = true
        ) {

            const isUser =
                message.sender_type ===
                "user";


            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "message-row " +
                (
                    isUser
                        ? "user"
                        : "admin"
                );


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "message-content";


            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                "message-bubble";


            bubble.textContent =
                message.message;


            const time =
                document.createElement(
                    "div"
                );

            time.className =
                "message-time";


            time.textContent =
                formatMessageTime(
                    message.created_at
                );


            content.appendChild(
                bubble
            );

            content.appendChild(
                time
            );

            row.appendChild(
                content
            );

            messages.appendChild(
                row
            );


            if (scroll) {

                scrollMessagesToBottom();

            }

        }


        // =========================================================
        // Format Time
        // =========================================================

        function formatMessageTime(
            value
        ) {

            if (!value) {

                return "";

            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }


            return date.toLocaleTimeString(
                "zh-TW",
                {
                    timeZone:
                        supportConfig.timezone ||
                        "Asia/Taipei",

                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        // =========================================================
        // Scroll
        // =========================================================

        function scrollMessagesToBottom() {

            requestAnimationFrame(
                function () {

                    messages.scrollTop =
                        messages.scrollHeight;

                }
            );

        }


        // =========================================================
        // Send Message
        // =========================================================

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        messageInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        async function sendMessage() {

            // -----------------------------------------------------
            // 再次確認支援時間
            // -----------------------------------------------------

            const supportState =
                getSupportState();


            if (!supportState.available) {

                updateSupportState();

                return;

            }


            const text =
                messageInput.value.trim();


            if (!text) {

                return;

            }


            if (!currentUser) {

                return;

            }


            // -----------------------------------------------------
            // 如果沒有開啟聊天室
            // 建立新聊天室
            // -----------------------------------------------------

            if (
                !currentRoom ||
                currentRoom.status !== "open"
            ) {

                const room =
                    await createRoom();


                if (!room) {

                    showError(
                        "無法建立客服聊天室。"
                    );

                    return;

                }


                messages.innerHTML = "";

            }


            sendButton.disabled =
                true;


            const {
                data,
                error
            } =
                await supabaseClient
                    .schema("public")
                    .from("chat_messages")
                    .insert({

                        room_id:
                            currentRoom.id,

                        sender_id:
                            currentUser.id,

                        sender_email:
                            currentUser.email,

                        sender_type:
                            "user",

                        message:
                            text,

                        is_read:
                            false

                    })
                    .select()
                    .single();


            sendButton.disabled =
                false;


            if (error) {

                console.error(
                    "傳送訊息失敗：",
                    error
                );

                showError(
                    "訊息傳送失敗，請稍後再試。"
                );

                return;

            }


            // -----------------------------------------------------
            // 更新聊天室預覽資訊
            // -----------------------------------------------------

            await updateRoomPreview(
                text
            );


            messageInput.value = "";

            autoResizeTextarea();

        }


        // =========================================================
        // Update Room Last Message
        // =========================================================

        async function updateRoomPreview(
            text
        ) {

            if (!currentRoom) {

                return;

            }


            const {
                error
            } =
                await supabaseClient
                    .schema("public")
                    .from("chat_rooms")
                    .update({

                        last_message:
                            text,

                        last_message_at:
                            new Date().toISOString()

                    })
                    .eq(
                        "id",
                        currentRoom.id
                    );


            if (error) {

                console.error(
                    "更新聊天室資訊失敗：",
                    error
                );

            }

        }


        // =========================================================
        // Mark Messages Read
        // =========================================================

        async function markMessagesAsRead() {

            if (!currentRoom) {

                return;

            }


            const {
                error
            } =
                await supabaseClient
                    .schema("public")
                    .from("chat_messages")
                    .update({
                        is_read: true
                    })
                    .eq(
                        "room_id",
                        currentRoom.id
                    )
                    .eq(
                        "sender_type",
                        "admin"
                    )
                    .eq(
                        "is_read",
                        false
                    );


            if (error) {

                console.error(
                    "更新已讀狀態失敗：",
                    error
                );

            }


            await supabaseClient
                .schema("public")
                .from("chat_rooms")
                .update({
                    unread_count: 0
                })
                .eq(
                    "id",
                    currentRoom.id
                );

        }


        // =========================================================
        // Realtime
        // =========================================================

        function subscribeRealtime() {

            if (!currentRoom) {

                return;

            }


            if (realtimeChannel) {

                supabaseClient.removeChannel(
                    realtimeChannel
                );

            }


            realtimeChannel =
                supabaseClient
                    .channel(
                        "user-chat-" +
                        currentRoom.id
                    )

                    // ------------------------------------------------
                    // 新訊息
                    // ------------------------------------------------

                    .on(
                        "postgres_changes",
                        {
                            event: "INSERT",

                            schema: "public",

                            table: "chat_messages",

                            filter:
                                "room_id=eq." +
                                currentRoom.id
                        },

                        async function (
                            payload
                        ) {

                            const message =
                                payload.new;


                            const isOwnMessage =
                                message.sender_id ===
                                currentUser.id;


                            if (
                                !isOwnMessage
                            ) {

                                appendMessage(
                                    message,
                                    true
                                );

                            }


                            // ----------------------------------------
                            // 管理員訊息自動標記已讀
                            // ----------------------------------------

                            if (
                                message.sender_type ===
                                "admin"
                            ) {

                                await supabaseClient
                                    .schema("public")
                                    .from(
                                        "chat_messages"
                                    )
                                    .update({
                                        is_read: true
                                    })
                                    .eq(
                                        "id",
                                        message.id
                                    );


                                await supabaseClient
                                    .schema("public")
                                    .from(
                                        "chat_rooms"
                                    )
                                    .update({
                                        unread_count: 0
                                    })
                                    .eq(
                                        "id",
                                        currentRoom.id
                                    );

                            }

                        }
                    )

                    // ------------------------------------------------
                    // 聊天室更新
                    // ------------------------------------------------

                    .on(
                        "postgres_changes",
                        {
                            event: "UPDATE",

                            schema: "public",

                            table: "chat_rooms",

                            filter:
                                "id=eq." +
                                currentRoom.id
                        },

                        async function (
                            payload
                        ) {

                            currentRoom =
                                payload.new;


                            if (
                                currentRoom.status ===
                                "closed"
                            ) {

                                setChatClosedState();


                                if (
                                    realtimeChannel
                                ) {

                                    await supabaseClient
                                        .removeChannel(
                                            realtimeChannel
                                        );

                                    realtimeChannel =
                                        null;

                                }

                            }

                        }
                    )

                    .subscribe();

        }


        // =========================================================
        // Textarea Auto Resize
        // =========================================================

        messageInput.addEventListener(
            "input",
            autoResizeTextarea
        );


        function autoResizeTextarea() {

            messageInput.style.height =
                "auto";


            messageInput.style.height =
                Math.min(
                    messageInput.scrollHeight,
                    130
                ) + "px";

        }


        // =========================================================
        // Logout
        // =========================================================

        logoutButton.addEventListener(
            "click",
            async function () {

                if (realtimeChannel) {

                    await supabaseClient
                        .removeChannel(
                            realtimeChannel
                        );

                    realtimeChannel =
                        null;

                }


                if (supportTimer) {

                    clearInterval(
                        supportTimer
                    );

                    supportTimer =
                        null;

                }


                if (sessionTimer) {

                    clearTimeout(
                        sessionTimer
                    );

                    sessionTimer =
                        null;

                }


                sessionStorage.removeItem(
                    MONEY_STATISTICS_SESSION_KEY
                );


                await supabaseClient.auth.signOut();


                redirectToLogin();

            }
        );


        // =========================================================
        // Error
        // =========================================================

        function showError(
            message
        ) {

            messages.innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <div class="empty-title">
                        發生錯誤
                    </div>

                    <div class="empty-description">
                        ${escapeHtml(message)}
                    </div>

                </div>

            `;

        }


        // =========================================================
        // Escape HTML
        // =========================================================

        function escapeHtml(
            value
        ) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                value;

            return div.innerHTML;

        }


        // =========================================================
        // Auth State Change
        // =========================================================

        supabaseClient.auth.onAuthStateChange(
            function (
                event,
                session
            ) {

                if (
                    event === "SIGNED_OUT"
                ) {

                    redirectToLogin();

                }

            }
        );

    </script>

</body>
</html>
