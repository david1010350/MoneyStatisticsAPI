<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Money Statistics - 客服</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f5f5f7;
            color: #1d1d1f;
        }

        /* =========================================================
           Header
        ========================================================= */

        .header {
            height: 64px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-bottom: 1px solid #e5e5e7;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .user-email {
            color: #6e6e73;
            font-size: 14px;
        }

        .logout-button {
            border: none;
            background: transparent;
            color: #0071e3;

            font-size: 14px;
            cursor: pointer;

            padding: 7px 10px;
            border-radius: 8px;
        }

        .logout-button:hover {
            background: #f0f0f2;
        }

        /* =========================================================
           Main
        ========================================================= */

        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px 50px;
        }

        .chat-card {
            height: calc(100vh - 150px);
            min-height: 520px;

            background: #ffffff;

            border: 1px solid #e5e5e7;
            border-radius: 18px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.05);

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* =========================================================
           Chat Header
        ========================================================= */

        .chat-header {
            height: 70px;

            display: flex;
            align-items: center;

            padding: 0 22px;

            border-bottom: 1px solid #e5e5e7;

            flex-shrink: 0;
        }

        .support-icon {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            background: #0071e3;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;

            margin-right: 13px;
        }

        .support-title {
            font-size: 17px;
            font-weight: 600;
        }

        .support-status {
            margin-top: 3px;

            color: #86868b;

            font-size: 13px;
        }

        .status-dot {
            display: inline-block;

            width: 7px;
            height: 7px;

            background: #34c759;

            border-radius: 50%;

            margin-right: 5px;
        }

        /* =========================================================
           Messages
        ========================================================= */

        .messages {
            flex: 1;

            overflow-y: auto;

            padding: 24px 22px;

            background: #fbfbfd;
        }

        .message-row {
            display: flex;

            margin-bottom: 14px;

            width: 100%;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.admin {
            justify-content: flex-start;
        }

        .message-content {
            max-width: min(72%, 620px);
        }

        .message-bubble {
            padding: 11px 15px;

            border-radius: 18px;

            font-size: 15px;
            line-height: 1.55;

            word-break: break-word;
            white-space: pre-wrap;
        }

        .message-row.user .message-bubble {
            background: #0071e3;
            color: white;

            border-bottom-right-radius: 5px;
        }

        .message-row.admin .message-bubble {
            background: #e9e9eb;
            color: #1d1d1f;

            border-bottom-left-radius: 5px;
        }

        .message-time {
            margin-top: 4px;

            font-size: 11px;

            color: #86868b;
        }

        .message-row.user .message-time {
            text-align: right;
        }

        .message-row.admin .message-time {
            text-align: left;
        }

        /* =========================================================
           Empty State
        ========================================================= */

        .empty-state {
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-direction: column;

            color: #86868b;

            text-align: center;
        }

        .empty-icon {
            width: 58px;
            height: 58px;

            border-radius: 50%;

            background: #f0f0f2;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;

            margin-bottom: 14px;
        }

        .empty-title {
            color: #1d1d1f;

            font-size: 17px;
            font-weight: 600;

            margin-bottom: 6px;
        }

        .empty-description {
            font-size: 14px;
        }

        /* =========================================================
           Input
        ========================================================= */

        .input-area {
            border-top: 1px solid #e5e5e7;

            padding: 14px 16px;

            background: #ffffff;

            display: flex;
            align-items: flex-end;

            gap: 10px;

            flex-shrink: 0;
        }

        .message-input {
            flex: 1;

            resize: none;

            min-height: 44px;
            max-height: 130px;

            border: 1px solid #d2d2d7;

            border-radius: 13px;

            padding: 11px 13px;

            font-family: inherit;
            font-size: 15px;

            outline: none;

            background: #ffffff;

            transition:
                border-color 0.15s,
                box-shadow 0.15s;
        }

        .message-input:focus {
            border-color: #0071e3;

            box-shadow:
                0 0 0 3px rgba(0, 113, 227, 0.12);
        }

        .send-button {
            height: 44px;

            padding: 0 18px;

            border: none;

            border-radius: 12px;

            background: #0071e3;
            color: white;

            font-size: 15px;
            font-weight: 500;

            cursor: pointer;

            transition:
                background 0.15s,
                opacity 0.15s;
        }

        .send-button:hover {
            background: #0077ed;
        }

        .send-button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        /* =========================================================
           Closed State
        ========================================================= */

        .closed-banner {
            display: none;

            padding: 13px 18px;

            background: #f5f5f7;

            border-top: 1px solid #e5e5e7;

            color: #6e6e73;

            text-align: center;

            font-size: 14px;
        }

        .closed-banner.show {
            display: block;
        }

        /* =========================================================
           Modal
        ========================================================= */

        .modal-overlay {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            align-items: center;
            justify-content: center;

            z-index: 1000;

            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 390px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.18);

            padding: 28px 26px 22px;

            text-align: center;
        }

        .modal-icon {
            width: 52px;
            height: 52px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #f5f5f7;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 23px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;

            margin-bottom: 9px;
        }

        .modal-message {
            font-size: 14px;

            line-height: 1.6;

            color: #6e6e73;

            margin-bottom: 23px;
        }

        .modal-button {
            width: 100%;

            height: 44px;

            border: none;

            border-radius: 11px;

            background: #0071e3;
            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        /* =========================================================
           Loading
        ========================================================= */

        .loading {
            color: #86868b;

            font-size: 14px;

            text-align: center;

            padding: 30px;
        }

        /* =========================================================
           Mobile
        ========================================================= */

        @media (max-width: 700px) {

            .header {
                padding: 0 15px;
            }

            .header-title {
                font-size: 18px;
            }

            .user-email {
                display: none;
            }

            .page {
                padding: 0;
            }

            .chat-card {
                height: calc(100vh - 64px);

                min-height: 0;

                border-radius: 0;

                border-left: none;
                border-right: none;

                box-shadow: none;
            }

            .message-content {
                max-width: 82%;
            }

            .messages {
                padding: 20px 14px;
            }

            .input-area {
                padding: 10px;
            }

            .send-button {
                padding: 0 15px;
            }
        }

    </style>
</head>

<body>

    <!-- =========================================================
         Header
    ========================================================= -->

    <header class="header">

        <div class="header-title">
            Money Statistics
        </div>

        <div class="header-right">

            <span
                id="userEmail"
                class="user-email">
                載入中...
            </span>

            <button
                id="logoutButton"
                class="logout-button">
                登出
            </button>

        </div>

    </header>


    <!-- =========================================================
         Main
    ========================================================= -->

    <main class="page">

        <section class="chat-card">

            <!-- Chat Header -->

            <div class="chat-header">

                <div class="support-icon">
                    💬
                </div>

                <div>

                    <div class="support-title">
                        Money Statistics 客服
                    </div>

                    <div
                        id="supportStatus"
                        class="support-status">

                        <span class="status-dot"></span>
                        線上客服

                    </div>

                </div>

            </div>


            <!-- Messages -->

            <div
                id="messages"
                class="messages">

                <div class="loading">
                    正在載入聊天室...
                </div>

            </div>


            <!-- Closed Banner -->

            <div
                id="closedBanner"
                class="closed-banner">

                此聊天室已結束。
                若您需要協助，請重新輸入訊息建立新的客服聊天室。

            </div>


            <!-- Input -->

            <div class="input-area">

                <textarea
                    id="messageInput"
                    class="message-input"
                    placeholder="輸入訊息..."
                    rows="1"></textarea>

                <button
                    id="sendButton"
                    class="send-button">

                    傳送

                </button>

            </div>

        </section>

    </main>


    <!-- =========================================================
         Session Expired Modal
    ========================================================= -->

    <div
        id="sessionModal"
        class="modal-overlay">

        <div class="modal">

            <div class="modal-icon">
                🔒
            </div>

            <div class="modal-title">
                工作階段已結束
            </div>

            <div class="modal-message">

                為了保護您的帳號安全，
                此次工作階段已經結束。

                <br>

                請重新登入 Money Statistics。

            </div>

            <button
                id="sessionConfirmButton"
                class="modal-button">

                確定

            </button>

        </div>

    </div>


    <script>

        // =========================================================
        // Supabase
        // =========================================================

        const SUPABASE_URL =
            "https://hztxqrfuqgdktxaushfo.supabase.co";

        const SUPABASE_ANON_KEY =
            window.SUPABASE_ANON_KEY;

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        // =========================================================
        // Session
        // =========================================================

        const MONEY_STATISTICS_SESSION_KEY =
            "moneyStatisticsSessionExpire";

        const SESSION_DURATION =
            30 * 60 * 1000;


        // =========================================================
        // State
        // =========================================================

        let currentUser = null;

        let currentRoom = null;

        let realtimeChannel = null;

        let sessionTimer = null;

        let loadingMessages = false;


        // =========================================================
        // DOM
        // =========================================================

        const userEmail =
            document.getElementById("userEmail");

        const messages =
            document.getElementById("messages");

        const messageInput =
            document.getElementById("messageInput");

        const sendButton =
            document.getElementById("sendButton");

        const logoutButton =
            document.getElementById("logoutButton");

        const closedBanner =
            document.getElementById("closedBanner");

        const supportStatus =
            document.getElementById("supportStatus");

        const sessionModal =
            document.getElementById("sessionModal");

        const sessionConfirmButton =
            document.getElementById("sessionConfirmButton");


        // =========================================================
        // Start
        // =========================================================

        document.addEventListener(
            "DOMContentLoaded",
            async function () {

                try {

                    await checkSession();

                } catch (error) {

                    console.error(
                        "初始化失敗：",
                        error
                    );

                    redirectToLogin();

                }

            }
        );


        // =========================================================
        // Check Session
        // =========================================================

        async function checkSession() {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();

            if (
                error ||
                !data ||
                !data.session ||
                !data.session.user
            ) {

                redirectToLogin();

                return;

            }

            currentUser =
                data.session.user;

            userEmail.textContent =
                currentUser.email || "";


            // -----------------------------------------------------
            // 30 分鐘工作階段
            // -----------------------------------------------------

            let expireTime =
                sessionStorage.getItem(
                    MONEY_STATISTICS_SESSION_KEY
                );


            if (!expireTime) {

                expireTime =
                    Date.now() +
                    SESSION_DURATION;

                sessionStorage.setItem(
                    MONEY_STATISTICS_SESSION_KEY,
                    expireTime.toString()
                );

            }


            if (
                Date.now() >=
                Number(expireTime)
            ) {

                showSessionExpired();

                return;

            }


            startSessionTimer(
                Number(expireTime)
            );


            await initializeChat();

        }


        // =========================================================
        // Session Timer
        // =========================================================

        function startSessionTimer(
            expireTime
        ) {

            if (sessionTimer) {

                clearTimeout(
                    sessionTimer
                );

            }


            const remaining =
                expireTime -
                Date.now();


            if (remaining <= 0) {

                showSessionExpired();

                return;

            }


            sessionTimer =
                setTimeout(
                    function () {

                        showSessionExpired();

                    },
                    remaining
                );

        }


        // =========================================================
        // Session Expired
        // =========================================================

        function showSessionExpired() {

            if (sessionTimer) {

                clearTimeout(
                    sessionTimer
                );

                sessionTimer = null;

            }


            messageInput.disabled = true;

            sendButton.disabled = true;


            sessionModal.classList.add(
                "show"
            );

        }


        sessionConfirmButton.addEventListener(
            "click",
            async function () {

                sessionStorage.removeItem(
                    MONEY_STATISTICS_SESSION_KEY
                );


                await supabaseClient.auth.signOut();


                redirectToLogin();

            }
        );


        // =========================================================
        // Redirect Login
        // =========================================================

        function redirectToLogin() {

            window.location.href =
                "login.html";

        }


        // =========================================================
        // Initialize Chat
        // =========================================================

        async function initializeChat() {

            await loadOrCreateRoom();

            if (currentRoom) {

                await loadMessages();

                subscribeRealtime();

            }

        }


        // =========================================================
        // Load / Create Room
        // =========================================================

        async function loadOrCreateRoom() {

            if (!currentUser) {

                return;

            }


            // -----------------------------------------------------
            // 找目前使用者的開啟聊天室
            // -----------------------------------------------------

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("chat_rooms")
                    .select("*")
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .eq(
                        "status",
                        "open"
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    )
                    .limit(1);


            if (error) {

                console.error(
                    "讀取聊天室失敗：",
                    error
                );

                showError(
                    "無法載入客服聊天室。"
                );

                return;

            }


            if (
                data &&
                data.length > 0
            ) {

                currentRoom =
                    data[0];

                setChatOpenState();

                return;

            }


            // -----------------------------------------------------
            // 沒有聊天室
            // 不立即建立空聊天室
            // -----------------------------------------------------

            currentRoom = null;

            setChatWaitingState();

        }


        // =========================================================
        // Create Room
        // =========================================================

        async function createRoom() {

            if (!currentUser) {

                return null;

            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("chat_rooms")
                    .insert({

                        user_id:
                            currentUser.id,

                        user_email:
                            currentUser.email,

                        status:
                            "open",

                        unread_count:
                            0,

                        last_message:
                            null,

                        last_message_at:
                            null

                    })
                    .select()
                    .single();


            if (error) {

                console.error(
                    "建立聊天室失敗：",
                    error
                );

                return null;

            }


            currentRoom =
                data;


            setChatOpenState();


            subscribeRealtime();


            return currentRoom;

        }


        // =========================================================
        // Waiting State
        // =========================================================

        function setChatWaitingState() {

            closedBanner.classList.remove(
                "show"
            );

            messageInput.disabled =
                false;

            sendButton.disabled =
                false;


            messages.innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">
                        💬
                    </div>

                    <div class="empty-title">
                        需要協助嗎？
                    </div>

                    <div class="empty-description">
                        請輸入訊息，我們會為您建立客服聊天室。
                    </div>

                </div>

            `;

            supportStatus.innerHTML = `
                <span class="status-dot"></span>
                線上客服
            `;

        }


        // =========================================================
        // Open State
        // =========================================================

        function setChatOpenState() {

            closedBanner.classList.remove(
                "show"
            );

            messageInput.disabled =
                false;

            sendButton.disabled =
                false;


            supportStatus.innerHTML = `
                <span class="status-dot"></span>
                線上客服
            `;

        }


        // =========================================================
        // Closed State
        // =========================================================

        function setChatClosedState() {

            messageInput.disabled =
                false;

            sendButton.disabled =
                false;

            closedBanner.classList.add(
                "show"
            );


            supportStatus.innerHTML =
                "聊天室已結束";


            messages.innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">
                        ✓
                    </div>

                    <div class="empty-title">
                        聊天室已結束
                    </div>

                    <div class="empty-description">
                        您可以輸入新的訊息開始新的客服對話。
                    </div>

                </div>

            `;

        }


        // =========================================================
        // Load Messages
        // =========================================================

        async function loadMessages() {

            if (
                !currentRoom ||
                loadingMessages
            ) {

                return;

            }


            loadingMessages = true;


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("chat_messages")
                    .select("*")
                    .eq(
                        "room_id",
                        currentRoom.id
                    )
                    .order(
                        "created_at",
                        {
                            ascending: true
                        }
                    );


            loadingMessages = false;


            if (error) {

                console.error(
                    "讀取訊息失敗：",
                    error
                );

                showError(
                    "無法載入聊天訊息。"
                );

                return;

            }


            renderMessages(
                data || []
            );


            await markMessagesAsRead();

        }


        // =========================================================
        // Render Messages
        // =========================================================

        function renderMessages(
            messageList
        ) {

            if (
                !messageList ||
                messageList.length === 0
            ) {

                messages.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            💬
                        </div>

                        <div class="empty-title">
                            開始與客服聊天
                        </div>

                        <div class="empty-description">
                            請輸入您的問題，我們會盡快回覆。
                        </div>

                    </div>

                `;

                return;

            }


            messages.innerHTML = "";


            messageList.forEach(
                function (message) {

                    appendMessage(
                        message,
                        false
                    );

                }
            );


            scrollMessagesToBottom();

        }


        // =========================================================
        // Append Message
        // =========================================================

        function appendMessage(
            message,
            scroll = true
        ) {

            const isUser =
                message.sender_type ===
                "user";


            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "message-row " +
                (
                    isUser
                        ? "user"
                        : "admin"
                );


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "message-content";


            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                "message-bubble";


            bubble.textContent =
                message.message;


            const time =
                document.createElement(
                    "div"
                );

            time.className =
                "message-time";


            time.textContent =
                formatMessageTime(
                    message.created_at
                );


            content.appendChild(
                bubble
            );

            content.appendChild(
                time
            );

            row.appendChild(
                content
            );

            messages.appendChild(
                row
            );


            if (scroll) {

                scrollMessagesToBottom();

            }

        }


        // =========================================================
        // Format Time
        // =========================================================

        function formatMessageTime(
            value
        ) {

            if (!value) {

                return "";

            }


            const date =
                new Date(value);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }


            return date.toLocaleTimeString(
                "zh-TW",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        // =========================================================
        // Scroll
        // =========================================================

        function scrollMessagesToBottom() {

            requestAnimationFrame(
                function () {

                    messages.scrollTop =
                        messages.scrollHeight;

                }
            );

        }


        // =========================================================
        // Send Message
        // =========================================================

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        messageInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        async function sendMessage() {

            const text =
                messageInput.value.trim();


            if (!text) {

                return;

            }


            if (!currentUser) {

                return;

            }


            // -----------------------------------------------------
            // 如果沒有開啟聊天室
            // 建立新聊天室
            // -----------------------------------------------------

            if (
                !currentRoom ||
                currentRoom.status !== "open"
            ) {

                const room =
                    await createRoom();


                if (!room) {

                    showError(
                        "無法建立客服聊天室。"
                    );

                    return;

                }


                messages.innerHTML = "";

            }


            sendButton.disabled =
                true;


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("chat_messages")
                    .insert({

                        room_id:
                            currentRoom.id,

                        sender_id:
                            currentUser.id,

                        sender_email:
                            currentUser.email,

                        sender_type:
                            "user",

                        message:
                            text,

                        is_read:
                            false

                    })
                    .select()
                    .single();


            sendButton.disabled =
                false;


            if (error) {

                console.error(
                    "傳送訊息失敗：",
                    error
                );

                showError(
                    "訊息傳送失敗，請稍後再試。"
                );

                return;

            }


            messageInput.value = "";

            autoResizeTextarea();


            // -----------------------------------------------------
            // Realtime 通常會自動顯示
            // 這裡不再手動 append
            // -----------------------------------------------------

        }


        // =========================================================
        // Update Room Last Message
        // =========================================================

        async function updateRoomPreview(
            text
        ) {

            if (!currentRoom) {

                return;

            }


            const {
                error
            } =
                await supabaseClient
                    .from("chat_rooms")
                    .update({

                        last_message:
                            text,

                        last_message_at:
                            new Date().toISOString()

                    })
                    .eq(
                        "id",
                        currentRoom.id
                    );


            if (error) {

                console.error(
                    "更新聊天室資訊失敗：",
                    error
                );

            }

        }


        // =========================================================
        // Mark Messages Read
        // =========================================================

        async function markMessagesAsRead() {

            if (!currentRoom) {

                return;

            }


            const {
                error
            } =
                await supabaseClient
                    .from("chat_messages")
                    .update({
                        is_read: true
                    })
                    .eq(
                        "room_id",
                        currentRoom.id
                    )
                    .eq(
                        "sender_type",
                        "admin"
                    )
                    .eq(
                        "is_read",
                        false
                    );


            if (error) {

                console.error(
                    "更新已讀狀態失敗：",
                    error
                );

            }


            await supabaseClient
                .from("chat_rooms")
                .update({
                    unread_count: 0
                })
                .eq(
                    "id",
                    currentRoom.id
                );

        }


        // =========================================================
        // Realtime
        // =========================================================

        function subscribeRealtime() {

            if (!currentRoom) {

                return;

            }


            if (realtimeChannel) {

                supabaseClient.removeChannel(
                    realtimeChannel
                );

            }


            realtimeChannel =
                supabaseClient
                    .channel(
                        "user-chat-" +
                        currentRoom.id
                    )

                    // ------------------------------------------------
                    // 新訊息
                    // ------------------------------------------------

                    .on(
                        "postgres_changes",
                        {
                            event: "INSERT",

                            schema: "public",

                            table: "chat_messages",

                            filter:
                                "room_id=eq." +
                                currentRoom.id
                        },

                        async function (
                            payload
                        ) {

                            const message =
                                payload.new;


                            // ----------------------------------------
                            // 避免自己的訊息重複顯示
                            // ----------------------------------------

                            const isOwnMessage =
                                message.sender_id ===
                                currentUser.id;


                            if (
                                !isOwnMessage
                            ) {

                                appendMessage(
                                    message,
                                    true
                                );

                            }


                            // ----------------------------------------
                            // 管理員訊息自動標記已讀
                            // ----------------------------------------

                            if (
                                message.sender_type ===
                                "admin"
                            ) {

                                await supabaseClient
                                    .from(
                                        "chat_messages"
                                    )
                                    .update({
                                        is_read: true
                                    })
                                    .eq(
                                        "id",
                                        message.id
                                    );


                                await supabaseClient
                                    .from(
                                        "chat_rooms"
                                    )
                                    .update({
                                        unread_count: 0
                                    })
                                    .eq(
                                        "id",
                                        currentRoom.id
                                    );

                            }

                        }
                    )

                    // ------------------------------------------------
                    // 聊天室更新
                    // ------------------------------------------------

                    .on(
                        "postgres_changes",
                        {
                            event: "UPDATE",

                            schema: "public",

                            table: "chat_rooms",

                            filter:
                                "id=eq." +
                                currentRoom.id
                        },

                        async function (
                            payload
                        ) {

                            currentRoom =
                                payload.new;


                            // ----------------------------------------
                            // 管理員結束聊天室
                            // ----------------------------------------

                            if (
                                currentRoom.status ===
                                "closed"
                            ) {

                                setChatClosedState();


                                if (
                                    realtimeChannel
                                ) {

                                    await supabaseClient
                                        .removeChannel(
                                            realtimeChannel
                                        );

                                    realtimeChannel =
                                        null;

                                }

                            }

                        }
                    )

                    .subscribe();

        }


        // =========================================================
        // Textarea Auto Resize
        // =========================================================

        messageInput.addEventListener(
            "input",
            autoResizeTextarea
        );


        function autoResizeTextarea() {

            messageInput.style.height =
                "auto";


            messageInput.style.height =
                Math.min(
                    messageInput.scrollHeight,
                    130
                ) + "px";

        }


        // =========================================================
        // Logout
        // =========================================================

        logoutButton.addEventListener(
            "click",
            async function () {

                if (realtimeChannel) {

                    await supabaseClient
                        .removeChannel(
                            realtimeChannel
                        );

                    realtimeChannel =
                        null;

                }


                if (sessionTimer) {

                    clearTimeout(
                        sessionTimer
                    );

                    sessionTimer =
                        null;

                }


                sessionStorage.removeItem(
                    MONEY_STATISTICS_SESSION_KEY
                );


                await supabaseClient.auth.signOut();


                redirectToLogin();

            }
        );


        // =========================================================
        // Error
        // =========================================================

        function showError(
            message
        ) {

            messages.innerHTML = `

                <div class="empty-state">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <div class="empty-title">
                        發生錯誤
                    </div>

                    <div class="empty-description">
                        ${escapeHtml(message)}
                    </div>

                </div>

            `;

        }


        // =========================================================
        // Escape HTML
        // =========================================================

        function escapeHtml(
            value
        ) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                value;

            return div.innerHTML;

        }


        // =========================================================
        // Auth State Change
        // =========================================================

        supabaseClient.auth.onAuthStateChange(
            function (
                event,
                session
            ) {

                if (
                    event === "SIGNED_OUT"
                ) {

                    redirectToLogin();

                }

            }
        );

    </script>

</body>
</html>
