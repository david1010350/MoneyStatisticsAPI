<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Money Statistics</title>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft JhengHei",
                sans-serif;

            background: #f5f5f7;

            color: #1d1d1f;

        }


        .header {

            height: 64px;

            padding: 0 32px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: rgba(255, 255, 255, 0.9);

            border-bottom:
                1px solid #e5e5e5;

            backdrop-filter: blur(20px);

        }


        .brand {

            font-size: 20px;

            font-weight: 600;

        }


        .user-area {

            display: flex;

            align-items: center;

            gap: 16px;

        }


        .user-email {

            color: #6e6e73;

            font-size: 14px;

        }


        .logout-button {

            padding: 8px 16px;

            border: 1px solid #d2d2d7;

            border-radius: 8px;

            background: white;

            color: #1d1d1f;

            cursor: pointer;

            font-size: 14px;

        }


        .logout-button:hover {

            background: #f5f5f7;

        }


        .content {

            max-width: 1100px;

            margin: 0 auto;

            padding: 60px 24px;

        }


        .welcome {

            margin-bottom: 40px;

        }


        .welcome h1 {

            margin: 0;

            font-size: 36px;

            font-weight: 600;

        }


        .welcome p {

            margin-top: 12px;

            color: #6e6e73;

        }


        .card-container {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(240px, 1fr));

            gap: 20px;

        }


        .card {

            padding: 28px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.06);

        }


        .card h2 {

            margin-top: 0;

            font-size: 20px;

        }


        .card p {

            color: #6e6e73;

            line-height: 1.6;

        }


        @media (max-width: 600px) {

            .header {

                padding: 0 16px;

            }

            .user-email {

                display: none;

            }

            .content {

                padding: 40px 16px;

            }

            .welcome h1 {

                font-size: 30px;

            }

        }

    </style>

</head>


<body>


    <!-- Header -->

    <header class="header">

        <div class="brand">
            Money Statistics
        </div>


        <div class="user-area">

            <span
                class="user-email"
                id="userEmail"
            >
                載入中…
            </span>


            <button
                class="logout-button"
                id="logoutButton"
            >
                登出
            </button>

        </div>

    </header>



    <!-- Main -->

    <main class="content">


        <div class="welcome">

            <h1>
                歡迎使用 Money Statistics
            </h1>

            <p>
                您已成功登入。
            </p>

        </div>



        <div class="card-container">


            <div class="card">

                <h2>
                    財務管理
                </h2>

                <p>
                    管理您的財務資料與相關統計。
                </p>

            </div>


            <div class="card">

                <h2>
                    方案
                </h2>

                <p>
                    查看目前 Money Statistics
                    使用方案與合約資訊。
                </p>

            </div>


            <div class="card">

                <h2>
                    帳號
                </h2>

                <p>
                    管理您的帳號與相關設定。
                </p>

            </div>


        </div>


    </main>



    <!-- Supabase Client -->

    <script src="supabase.js"></script>


    <script>

        // ========================================
        // DOM
        // ========================================

        const userEmail =
            document.getElementById("userEmail");

        const logoutButton =
            document.getElementById("logoutButton");



        // ========================================
        // 檢查登入狀態
        // ========================================

        async function checkLogin() {

            const {
                data: {
                    session
                }
            } = await supabaseClient.auth.getSession();


            // 沒有登入
            if (!session) {

                window.location.href =
                    "login.html";

                return;

            }


            // 顯示 Email

            userEmail.textContent =
                session.user.email;

        }



        checkLogin();



        // ========================================
        // 登出
        // ========================================

        logoutButton.addEventListener(
            "click",
            async function () {

                logoutButton.disabled = true;

                logoutButton.textContent =
                    "登出中…";


                const {
                    error
                } = await supabaseClient.auth.signOut();


                if (error) {

                    console.error(error);

                    alert(
                        "登出失敗：" +
                        error.message
                    );

                    logoutButton.disabled = false;

                    logoutButton.textContent =
                        "登出";

                    return;

                }


                // 登出成功

                window.location.href =
                    "login.html";

            }
        );

    </script>

</body>

</html>
