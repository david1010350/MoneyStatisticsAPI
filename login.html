<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Money Statistics - 登入</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft JhengHei",
                sans-serif;

            background: #f5f5f7;
            color: #1d1d1f;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            padding: 40px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 64px;
            height: 64px;

            margin: 0 auto 24px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 16px;

            background: #0071e3;
            color: white;

            font-size: 28px;
            font-weight: 600;
        }

        h1 {
            margin: 0;
            text-align: center;

            font-size: 28px;
            font-weight: 600;
        }

        .subtitle {
            margin-top: 10px;
            margin-bottom: 32px;

            text-align: center;

            color: #86868b;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            border: 1px solid #d2d2d7;
            border-radius: 10px;

            background: white;

            font-size: 16px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        input:focus {
            border-color: #0071e3;

            box-shadow:
                0 0 0 3px rgba(0, 113, 227, 0.15);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #0071e3;

            font-size: 14px;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            height: 48px;

            margin-top: 10px;

            border: none;
            border-radius: 12px;

            background: #0071e3;
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;
        }

        .login-button:hover {
            background: #0077ed;
        }

        .login-button:active {
            transform: scale(0.98);
        }

        .login-button:disabled {
            background: #a7c9ed;
            cursor: not-allowed;
        }

        .message {
            min-height: 22px;

            margin-top: 16px;

            text-align: center;

            font-size: 14px;
        }

        .error {
            color: #d70015;
        }

        .success {
            color: #248a3d;
        }

        .footer {
            margin-top: 28px;

            text-align: center;

            color: #86868b;

            font-size: 12px;
        }

        @media (max-width: 480px) {

            .login-container {
                padding: 16px;
            }

            .login-card {
                padding: 30px 24px;
            }

            h1 {
                font-size: 24px;
            }
        }

    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                M
            </div>

            <h1>Money Statistics</h1>

            <div class="subtitle">
                登入您的帳號
            </div>

            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        密碼
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="輸入您的密碼"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                        >
                            顯示
                        </button>

                    </div>

                </div>


                <!-- Login -->
                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    登入
                </button>

            </form>


            <!-- Message -->
            <div
                id="message"
                class="message"
            ></div>


            <div class="footer">
                Money Statistics
            </div>

        </div>

    </div>


    <!-- Supabase Client -->
    <script src="js/supabase.js"></script>


    <script>

        // ========================================
        // DOM
        // ========================================

        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");
        const showPasswordButton = document.getElementById("showPassword");


        // ========================================
        // 檢查是否已經登入
        // ========================================

        async function checkSession() {

            const {
                data: {
                    session
                }
            } = await supabaseClient.auth.getSession();


            if (session) {

                window.location.href = "index.html";

            }

        }


        checkSession();


        // ========================================
        // 顯示 / 隱藏密碼
        // ========================================

        showPasswordButton.addEventListener(
            "click",
            function () {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";

                    showPasswordButton.textContent = "隱藏";

                }
                else {

                    passwordInput.type = "password";

                    showPasswordButton.textContent = "顯示";

                }

            }
        );


        // ========================================
        // 登入
        // ========================================

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                // 清除訊息
                message.textContent = "";
                message.className = "message";


                // Loading
                loginButton.disabled = true;
                loginButton.textContent = "登入中…";


                try {

                    const {
                        data,
                        error
                    } = await supabaseClient.auth.signInWithPassword({

                        email: email,

                        password: password

                    });


                    if (error) {

                        throw error;

                    }


                    // 登入成功

                    message.textContent = "登入成功，正在進入 Money Statistics…";
                    message.className =
                        "message success";


                    // 稍微停留一下讓使用者看到訊息
                    setTimeout(
                        function () {

                            window.location.href =
                                "index.html";

                        },
                        300
                    );

                }
                catch (error) {

                    console.error(error);


                    message.textContent =
                        "登入失敗：" + error.message;

                    message.className =
                        "message error";


                    loginButton.disabled = false;
                    loginButton.textContent = "登入";

                }

            }
        );

    </script>

</body>
</html>
