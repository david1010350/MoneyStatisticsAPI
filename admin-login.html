<!DOCTYPE html>

<html lang="zh-Hant">
<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Money Statistics 管理員登入</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #f5f5f7;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        color: #1d1d1f;
    }

    .login-container {

        width: 100%;
        max-width: 420px;

        padding: 40px;

        background: #ffffff;

        border-radius: 20px;

        box-shadow:
            0 10px 40px rgba(0, 0, 0, 0.08);
    }

    .logo {

        width: 64px;
        height: 64px;

        margin: 0 auto 24px;

        display: block;

        object-fit: contain;
    }

    h1 {

        margin: 0;

        text-align: center;

        font-size: 26px;

        font-weight: 600;
    }

    .subtitle {

        margin-top: 8px;

        margin-bottom: 32px;

        text-align: center;

        color: #86868b;

        font-size: 14px;
    }

    .admin-badge {

        display: table;

        margin: 0 auto 24px;

        padding: 6px 12px;

        border-radius: 20px;

        background: #f2f2f7;

        color: #555;

        font-size: 13px;
    }

    label {

        display: block;

        margin-bottom: 8px;

        font-size: 14px;

        color: #555;
    }

    input {

        width: 100%;

        height: 46px;

        padding: 0 14px;

        margin-bottom: 18px;

        border: 1px solid #d2d2d7;

        border-radius: 10px;

        outline: none;

        font-size: 15px;

        background: #fff;

        transition:
            border-color 0.2s,
            box-shadow 0.2s;
    }

    input:focus {

        border-color: #007aff;

        box-shadow:
            0 0 0 3px rgba(0, 122, 255, 0.12);
    }

    .password-container {

        position: relative;
    }

    .password-container input {

        padding-right: 48px;
    }

    .password-toggle {

        position: absolute;

        right: 12px;
        top: 0;

        height: 46px;

        border: none;

        background: transparent;

        cursor: pointer;

        color: #007aff;

        font-size: 13px;
    }

    .login-button {

        width: 100%;

        height: 46px;

        margin-top: 8px;

        border: none;

        border-radius: 10px;

        background: #007aff;

        color: white;

        font-size: 16px;

        font-weight: 500;

        cursor: pointer;
    }

    .login-button:hover {

        background: #006fe6;
    }

    .login-button:disabled {

        background: #b8b8bd;

        cursor: not-allowed;
    }

    .message {

        min-height: 20px;

        margin-top: 18px;

        text-align: center;

        font-size: 14px;

        color: #d93025;
    }

    .back-link {

        display: block;

        margin-top: 24px;

        text-align: center;

        color: #007aff;

        text-decoration: none;

        font-size: 14px;
    }

    .back-link:hover {

        text-decoration: underline;
    }

    footer {

        position: fixed;

        bottom: 20px;

        left: 0;
        right: 0;

        text-align: center;

        font-size: 12px;

        color: #86868b;
    }

</style>
```

</head>

<body>

```
<div class="login-container">

    <img
        class="logo"
        src="https://www.dropbox.com/scl/fi/33fi9fbiq8j3wnwrytefl/newMS_White.png?rlkey=dhtxhyk47citb9dfuvjjsp6zx&st=g0yv4bqk&dl=1"
        alt="Money Statistics"
    >

    <div class="admin-badge">
        管理員專用
    </div>

    <h1>
        管理員登入
    </h1>

    <div class="subtitle">
        Money Statistics 管理員中心
    </div>

    <form id="adminLoginForm">

        <label for="email">
            Email
        </label>

        <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="管理員 Email"
            required
        >

        <label for="password">
            密碼
        </label>

        <div class="password-container">

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="輸入管理員密碼"
                required
            >

            <button
                type="button"
                class="password-toggle"
                id="togglePassword"
            >
                顯示
            </button>

        </div>

        <button
            type="submit"
            class="login-button"
            id="loginButton"
        >
            登入
        </button>

    </form>

    <div
        id="message"
        class="message"
    ></div>

    <a
        href="logon.html"
        class="back-link"
    >
        返回使用者登入
    </a>

</div>

<footer>
    Copyright © <span id="currentYear"></span> David Kao.
</footer>


<script>

    const form =
        document.getElementById("adminLoginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const loginButton =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");

    const togglePassword =
        document.getElementById("togglePassword");


    document.getElementById("currentYear")
        .textContent =
        new Date().getFullYear();


    togglePassword.addEventListener(
        "click",
        function () {

            if (
                passwordInput.type === "password"
            ) {

                passwordInput.type =
                    "text";

                togglePassword.textContent =
                    "隱藏";

            }
            else {

                passwordInput.type =
                    "password";

                togglePassword.textContent =
                    "顯示";
            }

        }
    );


    function translateLoginError(error) {

        if (!error) {

            return "登入失敗，請稍後再試。";
        }

        const text =
            (error.message || "")
                .toLowerCase();


        if (
            text.includes(
                "invalid login credentials"
            )
        ) {

            return "Email 或密碼錯誤。";
        }


        if (
            text.includes(
                "email not confirmed"
            )
        ) {

            return "此 Email 尚未完成驗證。";
        }


        if (
            text.includes("too many requests") ||
            text.includes("rate limit")
        ) {

            return "登入嘗試次數過多，請稍後再試。";
        }


        if (
            text.includes("network") ||
            text.includes("fetch")
        ) {

            return "目前無法連線至 Money Statistics 伺服器。";
        }


        return "登入失敗，請確認帳號與密碼。";
    }


    async function checkAdmin(userId) {

        const {
            data,
            error
        } = await supabaseClient

            .from("admin_users")

            .select(
                "user_id,email"
            )

            .eq(
                "user_id",
                userId
            )

            .maybeSingle();


        if (error) {

            console.error(
                "Admin check error:",
                error
            );

            return false;
        }


        return !!data;
    }


    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            message.textContent = "";

            loginButton.disabled = true;

            loginButton.textContent =
                "登入中…";


            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            try {

                /*
                 * 先清除舊 Session
                 */

                await supabaseClient.auth.signOut();


                /*
                 * Supabase Auth 登入
                 */

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .signInWithPassword({

                            email: email,

                            password: password

                        });


                if (error) {

                    throw error;
                }


                if (
                    !data ||
                    !data.user
                ) {

                    throw new Error(
                        "無法取得使用者資訊。"
                    );
                }


                /*
                 * 檢查是否為管理員
                 */

                const isAdmin =
                    await checkAdmin(
                        data.user.id
                    );


                if (!isAdmin) {

                    await supabaseClient
                        .auth
                        .signOut();


                    message.textContent =
                        "此帳號沒有管理員權限。";

                    return;
                }


                /*
                 * 建立管理員 Session
                 *
                 * 管理員也使用固定
                 * 30 分鐘工作階段。
                 */

                sessionStorage.setItem(
                    "moneyStatisticsAdminSessionExpire",
                    (
                        Date.now() +
                        30 * 60 * 1000
                    ).toString()
                );


                /*
                 * 前往管理員聊天室
                 */

                window.location.href =
                    "admin-chat.html";

            }
            catch (error) {

                console.error(
                    "Admin login error:",
                    error
                );

                message.textContent =
                    translateLoginError(
                        error
                    );

            }
            finally {

                loginButton.disabled = false;

                loginButton.textContent =
                    "登入";
            }

        }
    );


    /*
     * 如果已經登入，而且仍然
     * 是管理員，直接進入管理員中心。
     */

    async function checkExistingSession() {

        try {

            const {
                data
            } =
                await supabaseClient.auth
                    .getSession();


            const session =
                data.session;


            if (!session) {

                return;
            }


            const expire =
                sessionStorage.getItem(
                    "moneyStatisticsAdminSessionExpire"
                );


            if (!expire) {

                await supabaseClient
                    .auth
                    .signOut();

                return;
            }


            if (
                Date.now() >=
                Number(expire)
            ) {

                await supabaseClient
                    .auth
                    .signOut();

                sessionStorage.removeItem(
                    "moneyStatisticsAdminSessionExpire"
                );

                return;
            }


            const isAdmin =
                await checkAdmin(
                    session.user.id
                );


            if (!isAdmin) {

                await supabaseClient
                    .auth
                    .signOut();

                sessionStorage.removeItem(
                    "moneyStatisticsAdminSessionExpire"
                );

                return;
            }


            window.location.href =
                "admin-chat.html";

        }
        catch (error) {

            console.error(
                "Session check error:",
                error
            );
        }

    }


    checkExistingSession();

</script>

</body>
</html>
