<script>

/* ============================================================
   Elements
============================================================ */

const form =
    document.getElementById("adminLoginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const togglePassword =
    document.getElementById("togglePassword");


/* ============================================================
   Admin Session
============================================================ */

const ADMIN_SESSION_KEY =
    "moneyStatisticsAdminSessionExpire";

const ADMIN_SESSION_DURATION =
    30 * 60 * 1000;


/* ============================================================
   Year
============================================================ */

document.getElementById("currentYear")
    .textContent =
    new Date().getFullYear();


/* ============================================================
   Password Toggle
============================================================ */

togglePassword.addEventListener(
    "click",
    function () {

        if (
            passwordInput.type === "password"
        ) {

            passwordInput.type = "text";

            togglePassword.textContent =
                "隱藏";

        }
        else {

            passwordInput.type =
                "password";

            togglePassword.textContent =
                "顯示";
        }

    }
);


/* ============================================================
   Translate Login Error
============================================================ */

function translateLoginError(error) {

    if (!error) {

        return "登入失敗，請稍後再試。";
    }

    const text =
        String(error.message || "")
            .toLowerCase();


    if (
        text.includes(
            "invalid login credentials"
        ) ||
        text.includes(
            "invalid credentials"
        )
    ) {

        return "Email 或密碼錯誤。";
    }


    if (
        text.includes(
            "email not confirmed"
        )
    ) {

        return "此 Email 尚未完成驗證。";
    }


    if (
        text.includes("too many requests") ||
        text.includes("rate limit")
    ) {

        return "登入嘗試次數過多，請稍後再試。";
    }


    if (
        text.includes("network") ||
        text.includes("fetch") ||
        text.includes("failed to fetch")
    ) {

        return "目前無法連線至 Money Statistics 伺服器。";
    }


    return "登入失敗，請確認帳號與密碼。";
}


/* ============================================================
   Check Admin
============================================================ */

async function checkAdmin(userId) {

    console.log(
        "正在確認管理員身份：",
        userId
    );


    const {
        data,
        error
    } =
        await supabaseClient
         .schema("public")
            .from("admin_users")
            .select(
                "user_id,email"
            )
            .eq(
                "user_id",
                userId
            )
            .maybeSingle();


    if (error) {

        console.error(
            "Admin check error:",
            error
        );

        console.error(
            "Admin check code:",
            error.code
        );

        console.error(
            "Admin check message:",
            error.message
        );

        console.error(
            "Admin check details:",
            error.details
        );

        console.error(
            "Admin check hint:",
            error.hint
        );

        return false;
    }


    console.log(
        "Admin record:",
        data
    );


    return !!data;
}


/* ============================================================
   Login
============================================================ */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        message.textContent = "";

        loginButton.disabled = true;

        loginButton.textContent =
            "登入中…";


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        try {

            /*
             * 清除舊的 Auth Session
             */

            await supabaseClient.auth.signOut();


            /*
             * Supabase Auth 登入
             */

            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email: email,

                        password: password

                    });


            if (error) {

                throw error;
            }


            if (
                !data ||
                !data.user
            ) {

                throw new Error(
                    "無法取得管理員帳號資訊。"
                );
            }


            /*
             * 確認管理員身份
             */

            const isAdmin =
                await checkAdmin(
                    data.user.id
                );


            if (!isAdmin) {

                await supabaseClient
                    .auth
                    .signOut();


                sessionStorage.removeItem(
                    ADMIN_SESSION_KEY
                );


                message.textContent =
                    "此帳號沒有管理員權限。";

                return;
            }


            /*
             * 建立固定 30 分鐘 Session
             */

            sessionStorage.setItem(
                ADMIN_SESSION_KEY,
                (
                    Date.now() +
                    ADMIN_SESSION_DURATION
                ).toString()
            );


            console.log(
                "管理員登入成功：",
                data.user.email
            );


            /*
             * 使用 replace，
             * 避免 admin-login 留在瀏覽器歷史紀錄。
             */

            window.location.replace(
                "admin-chat.html"
            );

        }
        catch (error) {

            console.error(
                "Admin login error:",
                error
            );


            message.textContent =
                translateLoginError(
                    error
                );

        }
        finally {

            loginButton.disabled = false;

            loginButton.textContent =
                "登入";
        }

    }
);


/* ============================================================
   Existing Session
============================================================ */

async function checkExistingSession() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth
                .getSession();


        if (error) {

            console.error(
                "取得現有 Session 失敗：",
                error
            );

            return;
        }


        const session =
            data.session;


        if (!session) {

            return;
        }


        const expire =
            sessionStorage.getItem(
                ADMIN_SESSION_KEY
            );


        /*
         * 沒有管理員工作階段
         */

        if (!expire) {

            await supabaseClient
                .auth
                .signOut();

            return;
        }


        /*
         * 工作階段已過期
         */

        if (
            Date.now() >=
            Number(expire)
        ) {

            await supabaseClient
                .auth
                .signOut();

            sessionStorage.removeItem(
                ADMIN_SESSION_KEY
            );

            return;
        }


        /*
         * 確認仍然是管理員
         */

        const isAdmin =
            await checkAdmin(
                session.user.id
            );


        if (!isAdmin) {

            await supabaseClient
                .auth
                .signOut();

            sessionStorage.removeItem(
                ADMIN_SESSION_KEY
            );

            return;
        }


        /*
         * 已經是有效管理員 Session
         */

        window.location.replace(
            "admin-chat.html"
        );

    }
    catch (error) {

        console.error(
            "Existing session check error:",
            error
        );

    }

}


/* ============================================================
   Start
============================================================ */

checkExistingSession();

</script>
